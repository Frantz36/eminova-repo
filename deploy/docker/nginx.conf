# Nginx reverse proxy in front of Eminova.Host (TLS termination, HTTP→HTTPS, forwarded headers)
server {
    listen 80;
    server_name eminova.<CLIENT-DOMAIN>;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name eminova.<CLIENT-DOMAIN>;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50m;            # dataset uploads

    location / {
        proxy_pass         http://host:8080;      # or http://127.0.0.1:5000 when the host runs as a systemd service
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /healthz { proxy_pass http://host:8080/healthz; access_log off; }
}
