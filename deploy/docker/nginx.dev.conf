# Nginx configuration pour environnement Docker local / développement / staging
# Se place dans /etc/nginx/conf.d/default.conf dans le conteneur Nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_service {
    # Dans Docker Compose : nom du service backend
    server host:8080;

    # Note : Si vous testez avec un conteneur Nginx autonome en dehors de Docker Compose,
    # remplacez par : server host.docker.internal:8080;

    keepalive 32;
}

server {
    # Écoute sur le port 8000 (pour matcher le mapping -p 8000:8000) et sur le port 80 standard
    listen 8000;
    listen 80;
    server_name localhost;

    # Taille maximale des requêtes (nécessaire pour l'upload des fichiers de paie / CSV)
    client_max_body_size 50m;

    # Compression gzip pour accélérer les transferts
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Reverse proxy vers le service backend
    location / {
        proxy_pass         http://backend_service;
        proxy_http_version 1.1;

        # Support des WebSockets et connexions persistantes
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # En-têtes pour transmettre les informations réelles du client
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Délais d'attente (timeouts)
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffers pour les réponses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Endpoint de santé (/healthz) - logs d'accès désactivés pour ne pas polluer les logs
    location = /healthz {
        proxy_pass http://backend_service/healthz;
        access_log off;
    }
}
