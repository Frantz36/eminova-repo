// ---------- drawers (record detail + actions) ----------
const DRAWERS = {};
DRAWERS.opp = id => { const o=S.opportunities.find(x=>x.id===id); if(!o) return; DRAWER={type:'opp',id};
  const labels={fit:'Strategic fit',prob:'Win probability',margin:'Margin',risk:'Delivery risk (5 = low)',partner:'Partner risk (5 = low)',cost:'Bid cost (5 = low)'}; const sc=Object.values(o.score).reduce((a,b)=>a+b,0); const blocked=Object.entries(o.checks).filter(([k,v])=>!v).map(([k])=>k);
  const body=`${flowHTML(['Lead','Bid/No-bid','Proposal','Submitted','Awarded'],o.stage==='Lost'?'Submitted':o.stage)}<dl class="kv"><dt>Client</dt><dd>${esc(o.client)}</dd><dt>Value</dt><dd>${fmtR(o.value)}</dd><dt>Route</dt><dd>${esc(o.route)}</dd><dt>Deadline</dt><dd>${o.deadline}</dd></dl>
  <div><div class="eyebrow" style="margin-bottom:6px">Pre-bid checks</div>${Object.entries(o.checks).map(([k,v])=>chk(v,{conflict:'Conflict of interest check',integrity:'Integrity & sanctions check',eligibility:'Eligibility (CIDB / B-BBEE / PI cover)',capacity:'Capacity & competence available'}[k],null,'oppChk',o.id+'|'+k)).join('')}</div>
  <div><div class="eyebrow" style="margin-bottom:6px">Bid/no-bid scorecard · ${sc}/30</div>${Object.entries(o.score).map(([k,v])=>`<div class="slider" style="margin:4px 0"><label class="small" for="sc_${k}">${labels[k]} <input id="sc_${k}" type="range" min="1" max="5" value="${v}" data-act-input="oppScore" data-id="${o.id}|${k}"></label><span class="num small">${v}</span></div>`).join('')}<p class="small muted">Threshold 18/30 to proceed; approval under delegated bid authority.</p></div>
  ${blocked.length?`<div class="note crit"><b>Cannot proceed.</b> Failed: ${blocked.join(', ')}. Resolve or record a documented exception.</div>`:''}`;
  const foot = o.stage==='Bid/No-bid'?`<button class="btn pri" data-act="oppStage" data-id="${o.id}|Proposal" ${blocked.length||sc<18?'disabled':''}>Approve bid (G0) → Proposal</button><button class="btn danger" data-act="oppStage" data-id="${o.id}|Lost">No-bid</button>`
    : o.stage==='Proposal'?`<button class="btn pri" data-act="oppStage" data-id="${o.id}|Submitted">Freeze proposal & submit (G1)</button>`
    : o.stage==='Submitted'?`<button class="btn pri good" data-act="oppAward" data-id="${o.id}">Record award → contract review (G2)</button><button class="btn danger" data-act="oppStage" data-id="${o.id}|Lost">Record loss</button>`
    : o.stage==='Awarded'?`<span class="small muted">Converted to project ${esc(o.projId||'')}. Obligation register created from contract review.</span>`:`<span class="small muted">Closed. Debrief captured as lesson.</span>`;
  openDrawer(o.id, o.name, body, foot); };

DRAWERS.pkg = id => { const k=S.packages.find(x=>x.id===id); if(!k) return; DRAWER={type:'pkg',id};
  const ap=person(k.approver), ck=person(k.checker), au=person(k.author); const allChk=Object.values(k.checks).every(Boolean); const indepOk = k.tier==='A'||k.tier==='B' ? k.checker!==k.author : true; const apValid = ap.status==='Valid'||ap.status==='Expiring';
  const labels={self:'Self-check against discipline checklist',independent:`Peer review – independent checker (${esc(ck.name)})`,coord:'Discipline-lead review + interdisciplinary coordination',hse:'HSE / environmental design-risk review',comm:'Project manager review (commercial & programme)'};
  const body=`${flowHTML(PKG_FLOW,k.state)}<dl class="kv"><dt>Discipline</dt><dd>${esc(k.disc)} · ${pill('Tier '+k.tier,k.tier==='A'?'crit':k.tier==='B'?'warn':'neutral')}</dd><dt>Author</dt><dd>${esc(au.name)}</dd><dt>Checker</dt><dd>${esc(ck.name)}</dd><dt>Approver</dt><dd>${esc(ap.name)} ${ap.status==='Expired'?pill('Registration expired','crit'):pill(ap.status,kindOf.state(ap.status))}</dd><dt>Planned issue</dt><dd>${k.planned}</dd><dt>Requirements</dt><dd>${k.rtm}/${k.rtmTotal} traced</dd><dt>Comments</dt><dd>${k.comments.open} open · ${k.comments.closed} closed</dd></dl>
  <div class="note info small">${esc(tierNote(k.tier))}.</div>
  <div><div class="eyebrow" style="margin-bottom:6px">Review chain</div>${Object.entries(k.checks).map(([c,v])=>chk(v,labels[c],null,'pkgChk',k.id+'|'+c,['Approved','Issued'].includes(k.state)?'disabled':'')).join('')}</div>
  ${!indepOk?`<div class="note crit"><b>Checker must be independent of authorship</b> for tier ${k.tier}.</div>`:''}
  ${k.state==='In Review'&&!apValid?`<div class="note crit"><b>Approval blocked.</b> ${esc(ap.name)}'s ${esc(ap.body)} registration expired ${ap.expires}. The platform never infers statutory competence from role title. <button class="btn sm" style="margin-top:6px" data-act="pkgSub" data-id="${k.id}">Assign substitute approver (${esc(person('u1').name)})</button></div>`:''}
  ${k.comments.open?`<div class="btn-row"><button class="btn sm" data-act="pkgResolve" data-id="${k.id}">Resolve ${k.comments.open} open comment${k.comments.open>1?'s':''}</button><span class="small muted">Comments are never deleted after submission.</span></div>`:''}`;
  let foot='';
  if(k.state==='Draft') foot=`<button class="btn pri" data-act="pkgState" data-id="${k.id}|Submitted" ${k.checks.self?'':'disabled'}>Submit for review</button>${k.checks.self?'':'<span class="small muted">Self-check required first</span>'}`;
  else if(k.state==='Submitted') foot=`<button class="btn pri" data-act="pkgState" data-id="${k.id}|In Review">Start review</button>`;
  else if(k.state==='In Review') foot=`<button class="btn pri good" data-act="pkgApprove" data-id="${k.id}" ${allChk&&indepOk&&apValid&&!k.comments.open?'':'disabled'}>Approve (authorised person)</button><button class="btn" data-act="pkgState" data-id="${k.id}|Changes Required">Request changes</button>`;
  else if(k.state==='Changes Required') foot=`<button class="btn pri" data-act="pkgState" data-id="${k.id}|Submitted" ${k.comments.open?'disabled':''}>Resubmit revision</button>`;
  else if(k.state==='Approved') foot=`<button class="btn pri" data-act="pkgIssue" data-id="${k.id}">Issue via transmittal (document controller)</button>`;
  else foot=`<span class="small muted">Issued. Any change creates a new revision and an impact assessment.</span><button class="btn sm" data-act="pkgRevise" data-id="${k.id}">Raise revision</button>`;
  openDrawer(k.id, k.name, body, foot); };

DRAWERS.doc = id => { const d=S.docs.find(x=>x.id===id); if(!d) return; DRAWER={type:'doc',id};
  const body=`${flowHTML(DOC_STATES,d.state)}<dl class="kv"><dt>Type</dt><dd>${esc(d.type)}</dd><dt>Revision</dt><dd class="mono">${esc(d.rev)}</dd><dt>Suitability</dt><dd>${esc(d.suit)}</dd><dt>Classification</dt><dd>${esc(d.class)}</dd><dt>Owner</dt><dd>${esc(person(d.owner).name)}</dd><dt>Date</dt><dd>${d.date}</dd><dt>Retention</dt><dd>${d.type==='Drawing'||d.type==='Report'?'Professional record · 10 y after close-out':'Project record · 5 y'}</dd></dl>
  <div><div class="eyebrow" style="margin-bottom:6px">Revision history</div><div class="tl">${(d.hist||[{w:d.date,t:`${d.rev} · ${d.state}`}]).map(h=>`<div class="e"><div class="w">${esc(h.w)}</div><div>${esc(h.t)}</div></div>`).join('')}</div></div>
  ${d.state==='Superseded'?'<div class="note"><b>Superseded.</b> Retained for history; no reissue without a new revision. Cannot be selected as current issue for new field work.</div>':''}`;
  let foot=''; const go=(st,l,cls)=>`<button class="btn ${cls||''}" data-act="docState" data-id="${d.id}|${st}">${l}</button>`;
  if(d.state==='Working draft') foot=go('Internal review','Submit for internal review','pri');
  else if(d.state==='Internal review') foot=go('Approved','Approve for stated purpose','pri')+go('Client review','Issue for client comment')+go('Working draft','Revise');
  else if(d.state==='Client review') foot=go('Approved','Client accepted → Approved','pri')+go('Working draft','Revise');
  else if(d.state==='Approved') foot=go('Issued for Tender','Issue for Tender','pri')+go('Issued for Construction','Issue for Construction')+`<button class="btn" data-act="docSupersede" data-id="${d.id}">Supersede</button>`;
  else if(d.state==='Issued for Tender') foot=`<button class="btn" data-act="docSupersede" data-id="${d.id}">Addendum → new revision</button>`;
  else if(d.state==='Issued for Construction') foot=go('As-built / record','Record as-built','pri')+`<button class="btn" data-act="docSupersede" data-id="${d.id}">Revision</button>`;
  else if(d.state==='As-built / record') foot='<span class="small muted">Archived record · controlled correction only</span>';
  else foot='<span class="small muted">Superseded · read-only</span>';
  openDrawer(d.id, d.title, body, foot); };

DRAWERS.ncr = id => { const n=S.ncrs.find(x=>x.id===id); if(!n) return; DRAWER={type:'ncr',id}; const i=NCR_FLOW.indexOf(n.state); const next=NCR_FLOW[i+1];
  const needCause = n.state==='Root cause' && !n.rca;
  const body=`${flowHTML(NCR_FLOW,n.state)}<dl class="kv"><dt>Project</dt><dd class="mono">${n.proj}</dd><dt>Severity</dt><dd>${pill(n.sev,kindOf.sev(n.sev))}</dd><dt>Source</dt><dd>${esc(n.source)}</dd><dt>Requirement</dt><dd>${esc(n.req)}</dd><dt>Owner</dt><dd>${esc(person(n.owner).name)}</dd><dt>Raised / due</dt><dd>${n.raised} → ${n.due}</dd><dt>Disposition</dt><dd>${esc(n.disposition)}</dd><dt>Root cause</dt><dd>${esc(n.rca||n.cause)}</dd><dt>CAPA</dt><dd class="mono">${esc(n.capa)}</dd></dl>
  ${n.state==='Contained'?`<div class="field"><label for="ncrDisp">Disposition authority</label><select id="ncrDisp" data-act-change="ncrDisp" data-id="${n.id}"><option ${n.disposition==='Rework'?'selected':''}>Rework</option><option ${n.disposition==='Repair'?'selected':''}>Repair</option><option ${n.disposition.startsWith('Accept')?'selected':''}>Accept-as-is (concession)</option><option ${n.disposition==='Reject'?'selected':''}>Reject</option><option ${n.disposition==='Replace'?'selected':''}>Replace</option></select></div>`:''}
  ${n.state==='Root cause'?`<div class="field"><label for="ncrRca">Root-cause analysis (5-why / fishbone summary)</label><textarea id="ncrRca" data-act-input="ncrRca" data-id="${n.id}" placeholder="Required before corrective action can be approved">${esc(n.rca||'')}</textarea></div>`:''}
  ${n.state==='Verification'?`<div class="note"><b>Verify effectiveness.</b> Confirmed by someone other than the action owner after an appropriate interval. Measure: ${esc((S.capas.find(c=>c.id===n.capa)||{}).measure||'as defined in CAPA')}. If verification fails or recurrence is detected the NCR must be reopened.</div>`:''}`;
  const foot = next ? `<button class="btn pri" data-act="ncrNext" data-id="${n.id}" ${needCause?'disabled':''}>${n.state==='Verification'?'Verified effective → Closed':'Advance → '+next}</button>${n.state==='Verification'?`<button class="btn danger" data-act="ncrReopen" data-id="${n.id}">Verification failed → reopen</button>`:''}${needCause?'<span class="small muted">Enter the root cause first</span>':''}` : `<span class="small muted">Closed with objective evidence · trend analysed.</span><button class="btn sm danger" data-act="ncrReopen" data-id="${n.id}">Recurrence → reopen</button>`;
  openDrawer(n.id, n.title, body, foot); };

DRAWERS.risk = id => { const r=S.risks.find(x=>x.id===id); if(!r) return; DRAWER={type:'risk',id};
  const body=`<dl class="kv"><dt>Project</dt><dd class="mono">${r.proj}</dd><dt>Category</dt><dd>${esc(r.cat)}</dd><dt>Likelihood</dt><dd>${r.L} / 5</dd><dt>Consequence</dt><dd>${r.C} / 5</dd><dt>Score</dt><dd><b>${r.L*r.C}</b> · ${r.L*r.C>=15?'Critical':r.L*r.C>=10?'High':r.L*r.C>=5?'Medium':'Low'}</dd><dt>Owner</dt><dd>${esc(person(r.owner).name)}</dd><dt>Treatment</dt><dd>${esc(r.treat)}</dd><dt>Due</dt><dd>${r.due}</dd><dt>State</dt><dd>${pill(r.state,kindOf.state(r.state))}</dd></dl>
  <div class="grid g2" style="gap:8px"><div class="field"><label for="rL">Likelihood</label><select id="rL" data-act-change="riskL" data-id="${r.id}">${[1,2,3,4,5].map(v=>`<option ${v===r.L?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="rC">Consequence</label><select id="rC" data-act-change="riskC" data-id="${r.id}">${[1,2,3,4,5].map(v=>`<option ${v===r.C?'selected':''}>${v}</option>`).join('')}</select></div></div>`;
  const foot = r.state==='Closed'?'<span class="small muted">Closed</span>':`<button class="btn pri" data-act="riskTreated" data-id="${r.id}">Record treatment verified</button>${r.state==='Overdue'?`<button class="btn" data-act="riskExtend" data-id="${r.id}">Re-baseline due date (logged)</button>`:''}`;
  openDrawer(r.id, r.title, body, foot); };

DRAWERS.ce = id => { const c=S.changes.find(x=>x.id===id); if(!c) return; DRAWER={type:'ce',id}; const P=S.persona; const limit = ['pm','dl','eng','com','dc','site'].includes(P)?S.doa.pm:['md'].includes(P)?S.doa.director:P==='admin'||P==='client'||P==='bd'||P==='qm'?0:S.doa.pm; const canApprove = c.fee<=limit;
  const labels={tech:'Technical / design',sched:'Schedule',fee:'Fee / cost',risk:'Risk & HSE',contract:'Contractual / claims'}; const allImp=Object.values(c.impacts).every(Boolean);
  const body=`${flowHTML(CE_FLOW,c.state)}<dl class="kv"><dt>Project</dt><dd class="mono">${c.proj}</dd><dt>Trigger</dt><dd>${esc(c.trigger)}</dd><dt>Fee impact</dt><dd class="num">${fmtR(c.fee)}</dd><dt>Time impact</dt><dd>${c.days} days</dd><dt>Notice</dt><dd>${esc(c.notice)}</dd></dl>
  <div><div class="eyebrow" style="margin-bottom:6px">Impact assessment</div>${Object.entries(c.impacts).map(([k,v])=>chk(v,labels[k]+' assessed',null,'ceImp',c.id+'|'+k,['Approved','Implemented','Verified'].includes(c.state)?'disabled':'')).join('')}</div>
  ${['Submitted','Impact assessed'].includes(c.state)?(canApprove?`<div class="note good"><b>Within your delegated limit</b> (${fmtR(limit)}).</div>`:`<div class="note crit"><b>Above your delegated limit</b> (${limit?fmtR(limit):'no change authority for this persona'}). Approval must be given by ${c.fee<=S.doa.director?'a director':'the board'}; switch persona in the top bar to demonstrate.</div>`):''}`;
  let foot='';
  if(c.state==='Logged') foot=`<button class="btn pri" data-act="ceState" data-id="${c.id}|Screened">Screen authority & issue notice</button>`;
  else if(c.state==='Screened') foot=`<button class="btn pri" data-act="ceState" data-id="${c.id}|Impact assessed" ${allImp?'':'disabled'}>Complete impact assessment</button>`;
  else if(c.state==='Impact assessed') foot=`<button class="btn pri" data-act="ceState" data-id="${c.id}|Submitted">Submit for approval</button>`;
  else if(c.state==='Submitted') foot=`<button class="btn pri good" data-act="ceApprove" data-id="${c.id}" ${canApprove&&allImp?'':'disabled'}>Approve & revise baseline</button><button class="btn danger" data-act="ceState" data-id="${c.id}|Logged">Reject (back to log)</button>`;
  else if(c.state==='Approved') foot=`<button class="btn pri" data-act="ceState" data-id="${c.id}|Implemented">Mark implemented across deliverables</button>`;
  else if(c.state==='Implemented') foot=`<button class="btn pri" data-act="ceState" data-id="${c.id}|Verified">Verify (BoQ, programme, forecast, as-built)</button>`;
  else foot='<span class="small muted">Verified. Baseline history retained.</span>';
  openDrawer(c.id, c.title, body, foot); };

const EVK={close:'var(--crit)',tender:'var(--warn)',gate:'var(--accent)',qms:'var(--good)',internal:'var(--s7)',meeting:'var(--s3)'};
function evDate(e){ return e.d; }
function hubCalendar(){ const ym=UI.calYM||'2026-10'; const [y,m]=ym.split('-').map(Number); const first=new Date(y,m-1,1); const startDow=(first.getDay()+6)%7; const days=new Date(y,m,0).getDate(); const sel=UI.calDay||today;
  const cells=[]; for(let i=0;i<startDow;i++){ const d=new Date(y,m-1,i-startDow+1); cells.push({d:d.toISOString().slice(0,10),out:true}); } for(let i=1;i<=days;i++) cells.push({d:`${y}-${String(m).padStart(2,'0')}-${String(i).padStart(2,'0')}`,out:false}); while(cells.length%7) { const d=new Date(y,m-1,days+(cells.length-startDow-days)+1); cells.push({d:d.toISOString().slice(0,10),out:true}); }
  const evs=d=>S.events.filter(e=>evDate(e)===d); const prev=`${m===1?y-1:y}-${String(m===1?12:m-1).padStart(2,'0')}`, next=`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}`;
  const agenda=evs(sel); const C=S.hubConnectors;
  return `<div class="mailshell cal"><div class="cal-side"><div class="btn-row" style="margin-bottom:10px"><button class="btn pri" data-act="calNew" data-id="${sel}">+ New event</button></div>
    <div class="eyebrow">Calendars</div><div class="cal-list">${[['CiviQMS native','var(--accent)',true],['Tender deadlines','var(--crit)',true],['Project gates','var(--s7)',true],['QMS audits','var(--good)',true],[C.m365?'Outlook (Graph sync)':'Outlook – not connected','var(--s1)',C.m365],[C.google?'Google Calendar (sync)':'Google Calendar – not connected','var(--s4)',C.google]].map(([n,c,on])=>`<div class="cal-item ${on?'':'off'}"><i style="background:${c}"></i>${n}</div>`).join('')}</div>

  <div class="cal-main"><div class="cal-head"><button class="btn sm" data-act="calYM" data-id="${prev}">‹</button><button class="btn sm" data-act="calYM" data-id="2026-10">Today</button><button class="btn sm" data-act="calYM" data-id="${next}">›</button><h3 style="margin-left:8px">${MONTHS[m-1]} ${y}</h3><span class="spacer"></span><div class="filters"><button class="fbtn" aria-pressed="true">Month</button><button class="fbtn" data-act="toastOnly" data-id="Week and day views use the same native event store">Week</button><button class="fbtn" data-act="toastOnly" data-id="Week and day views use the same native event store">Day</button></div><span class="small muted hide-m">SAST · UTC+2</span></div>
    <div class="cal-grid"><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div><div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div><div class="cal-dow">Sun</div>${cells.map(c=>`<button class="cal-cell ${c.out?'out':''} ${c.d===today?'today':''} ${c.d===sel?'sel':''}" data-act="calDay" data-id="${c.d}"><span class="dn">${+c.d.slice(8)}</span>${evs(c.d).slice(0,3).map(e=>`<span class="ev" style="background:${EVK[e.k]||'var(--line-2)'}" title="${esc(e.t)}">${esc(e.t)}</span>`).join('')}${evs(c.d).length>3?`<span class="small muted">+${evs(c.d).length-3} more</span>`:''}</button>`).join('')}</div></div>

    ${UI.calCompose?`<form id="evForm" class="form" style="grid-template-columns:1fr;margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><div class="field"><label for="evT">Title</label><input id="evT" required placeholder="e.g. Site visit – P577 km 12"></div><div class="field"><label for="evD">Date</label><input id="evD" type="date" value="${sel}"></div><div class="field"><label for="evK">Type</label><select id="evK"><option value="meeting">Meeting</option><option value="internal">Internal milestone</option><option value="tender">Tender event</option><option value="qms">QMS</option></select></div><div class="field"><label for="evC">Linked to</label><select id="evC">${[...S.tenders.filter(t=>t.status==='Open').map(t=>t.id),...S.projects.map(p=>p.id)].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="evN">Notes / attendees</label><textarea id="evN" placeholder="@mention attendees; Teams/Meet links are optional"></textarea></div><div class="btn-row"><button class="btn pri" type="submit">Save${C.m365?' + Outlook':C.google?' + Google':''}</button><button class="btn" type="button" data-act="calNew" data-id="x">Cancel</button></div></form>`:''}</div></div>`; }

function hubMail(){ ensureMail(); const F=UI.mailFolder||'inbox'; const folders=[['inbox','Inbox',S.emails.filter(e=>e.dir==='In'&&!e.filedOnly).length,S.emails.filter(e=>e.dir==='In'&&e.unread).length],['sent','Sent',S.emails.filter(e=>e.dir==='Out').length,0],['drafts','Drafts',UI.mailDraft?1:0,0],['unfiled','Not yet filed',S.emails.filter(e=>!e.filed).length,0]];

  const sel=S.emails.find(e=>e.id===UI.mailSel)||list[0]; const C=S.hubConnectors; const via=C.m365?'Microsoft 365 (Graph)':C.google?'Gmail API':'SMTP / IMAP';

    <div class="eyebrow" style="margin:12px 0 4px">Accounts</div><div class="small">bids@abc-civil.co.za<br><span class="muted">${via}${C.m365?' · synced':C.google?' · synced':' · native'}</span></div></div>
  <div class="mail-list"><div class="mail-search"><input placeholder="Search mail (permission-aware, OpenSearch)" aria-label="Search mail"></div>${list.length?list.map(e=>`<button class="mi ${e.id===(sel||{}).id?'on':''} ${e.unread?'unread':''}" data-act="mailSel" data-id="${e.id}"><span class="av">${esc((e.name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</span><span class="mb"><span class="mrow"><span class="mn">${esc(e.dir==='Out'?'To: '+e.ctx:e.name)}</span><span class="md">${e.date===today?e.time:e.date.slice(5)}</span></span><span class="ms">${esc(e.subj)}</span><span class="mp">${esc(e.body.slice(0,70))}…</span><span class="mt">${e.att.length?'📎 ':''}${pill(e.ctx,'neutral')}${e.filed?'':pill('unfiled','warn')}</span></span></button>`).join(''):'<p class="small muted" style="padding:14px">Nothing here.</p>'}</div>
  <div class="mail-read">${compose?`<div class="mail-rh"><h3>New message</h3><span class="spacer"></span><button class="btn sm ghost" data-act="mailCompose" data-id="close">✕</button></div><form id="mailForm" class="mail-compose"><div class="crow"><label for="mTo">To</label><input id="mTo" value="${esc(UI.mailTo||'')}" placeholder="name@organisation.co.za"></div><div class="crow"><label for="mCc">Cc</label><input id="mCc" placeholder=""></div><div class="crow"><label for="mSubj">Subject</label><input id="mSubj" value="${esc(UI.mailSubj||'')}" placeholder="Reference number first"></div><div class="crow"><label for="mCtx">File to</label><select id="mCtx">${[...S.tenders.filter(t=>t.status==='Open').map(t=>t.id),...S.projects.map(p=>p.id)].map(x=>`<option ${x===UI.mailCtx?'selected':''}>${x}</option>`).join('')}</select></div><div class="crow"><label>Template</label><div class="filters"><button type="button" class="fbtn" data-act="mailTpl" data-id="clar">Clarification</button><button type="button" class="fbtn" data-act="mailTpl" data-id="brief">Briefing confirmation</button><button type="button" class="fbtn" data-act="mailTpl" data-id="tx">Transmittal cover</button></div></div><textarea id="mBody" placeholder="Write your message…">${esc(UI.mailBody||'')}</textarea><div class="btn-row" style="padding:10px 14px;border-top:1px solid var(--line)"><button class="btn pri" type="submit">Send via ${via}</button><button class="btn" type="button" data-act="toastOnly" data-id="Attachments are quarantined and malware-scanned before sending">📎 Attach</button><button class="btn ghost" type="button" data-act="mailCompose" data-id="draft">Save draft</button><span class="small muted">Outbound mail is audited and filed automatically.</span></div></form>`

  <div class="chat-info"><div class="eyebrow">Members</div>${members.map(u=>`<div class="small" style="display:flex;gap:8px;align-items:center;padding:4px 0"><span class="av" style="width:24px;height:24px;font-size:10px">${esc(person(u).name.split(' ').map(x=>x[0]).join(''))}</span>${esc(person(u).name)}</div>`).join('')}
    <div class="eyebrow" style="margin-top:14px">Pinned decisions</div>${(rm.decisions||[]).length?(rm.decisions||[]).map(d=>`<div class="small" style="padding:6px 8px;background:var(--surface-2);border-radius:6px;margin-top:6px">★ ${esc(d)}</div>`).join(''):'<p class="small muted">Mark a message as a decision to pin it with evidence.</p>'}
    <div class="eyebrow" style="margin-top:14px">Actions from this room</div>${S.actions.filter(a=>a.src.includes(rm.id)).map(a=>`<div class="small" style="padding:4px 0;display:flex;justify-content:space-between;gap:6px"><span>${esc(a.t.slice(0,40))}</span>${pill(a.st,a.st==='Done'?'good':'warn')}</div>`).join('')||'<p class="small muted">None yet.</p>'}
    <div class="eyebrow" style="margin-top:14px">Files</div><div class="small muted">Readiness pack SNAP-1183 · Letter of authority.pdf</div></div></div>`; }

R.hub = () => { const tab=UI.hubTab||'mail'; const tabs=[['mail','Mail'],['calendar','Calendar'],['chat','Chat'],['timeline','Activity'],['actions','Actions'],['conn','Integrations']]; let body=''; const C=S.hubConnectors;
  if(tab==='mail') body=hubMail(); else if(tab==='calendar') body=hubCalendar(); else if(tab==='chat') body=hubChat();
  else if(tab==='timeline'){ const items=[...S.audit.slice(0,8).map(a=>({ts:a.ts,k:'system',t:`${a.who} ${a.action}`,s:a.ref})),...S.emails.slice(0,4).map(e=>({ts:e.date,k:'email',t:`${e.dir==='In'?'Received':'Sent'}: ${e.subj}`,s:e.ctx})),...S.events.filter(e=>e.d>=today).slice(0,3).map(e=>({ts:e.d,k:'calendar',t:e.t,s:e.ctx})),...S.rooms.flatMap(r=>r.msgs.slice(-1).map(m=>({ts:m.ts,k:'chat',t:`${person(m.who).name}: ${m.t}`,s:r.name}))),...S.aiRuns.slice(0,2).map(a=>({ts:a.ts.slice(5),k:'ai',t:`AI run ${a.id} · ${a.uc} · ${Math.round(a.conf*100)}%`,s:a.rev}))];
    body=`<div class="panel"><div class="ph"><h3>Unified activity stream</h3><span class="small muted">system events, AI jobs, documents, approvals, deadlines and communications · filtered by your access</span></div><div class="list">${items.map(i=>`<div class="li"><span class="stripe ${({system:'info',email:'good',calendar:'warn',chat:'',ai:'crit'})[i.k]||''}"></span><span class="b"><div class="t">${esc(i.t)}</div><div class="s">${esc(i.ts)} · ${esc(i.s)}</div></span>${pill(i.k,'neutral')}</div>`).join('')}</div></div>`; }
  else if(tab==='actions'){ body=`<div class="panel"><div class="ph"><h3>Actions</h3><span class="small muted">converted from messages, email, calendar items and readiness gaps</span></div><div class="pb tight">${tbl([{h:'Action'},{h:'Owner'},{h:'Due'},{h:'Source'},{h:'State'},{h:''}],S.actions.map(a=>`<tr><td><span class="ref">${a.id}</span> ${esc(a.t)}</td><td>${esc(person(a.owner).name)}</td><td class="num" style="${a.due<today&&a.st==='Open'?'color:var(--crit)':''}">${a.due}</td><td class="small">${esc(a.src)}</td><td>${pill(a.st,a.st==='Done'?'good':'warn')}</td><td>${a.st==='Open'?`<button class="btn sm" data-act="actionDone" data-id="${a.id}">Mark done</button>`:''}</td></tr>`))}</div></div>`; }
  else { const rows=[['smtp','SMTP / IMAP (generic mail)','Native path · required',true],['caldav','CalDAV / iCalendar','Native path · required',true],['m365','Microsoft 365 (Outlook mail & calendar via Graph)','Optional edge adapter · OAuth, no stored passwords · Teams not required',false],['google','Google Workspace (Gmail & Google Calendar API)','Optional edge adapter · incremental OAuth scopes',false]];
    body=`<div class="grid g2"><div class="panel"><div class="ph"><h3>Connectors</h3></div><div class="list">${rows.map(([k,n,d])=>`<div class="li"><span class="b"><div class="t">${n}</div><div class="s">${d}</div></span><button class="btn sm ${C[k]?'good':''}" data-act="hubConn" data-id="${k}">${C[k]?'Connected · disconnect':'Connect'}</button></div>`).join('')}</div></div>
    <div class="panel"><div class="ph"><h3>Independence check (NFR-01)</h3></div><div class="pb"><div class="note ${!C.m365&&!C.google?'good':'info'}"><b>${!C.m365&&!C.google?'Standalone mode.':'Optional adapters active.'}</b> Mail, calendar, chat, actions, approvals and documents all run natively. ${!C.m365&&!C.google?'No Microsoft or Google tenant, licence or API is configured; every workflow in this demo still executes (acceptance scenarios A1/A10).':'Disconnecting both adapters does not reduce any capability; externally owned fields follow the external source, CiviQMS metadata stays local.'}</div><dl class="kv" style="margin-top:12px"><dt>Identity</dt><dd>Keycloak local users + MFA; federation optional</dd><dt>Chat</dt><dd>Matrix homeserver (self-hosted)</dd><dt>Mail</dt><dd>${C.m365?'Graph + SMTP':C.google?'Gmail API + SMTP':'SMTP/IMAP only'}</dd><dt>Calendar</dt><dd>${C.m365?'Graph + CalDAV':C.google?'Google Calendar + CalDAV':'Native + CalDAV'}</dd><dt>Connector failure policy</dt><dd>Never blocks native work; retry with back-off → dead-letter queue</dd></dl></div></div></div>`; }
  return wsHead('Communications hub','A native mail client, calendar and chat that look and work the way Outlook, Gmail and Teams do, persisted in CiviQMS with retention, access control and an outbound audit. Microsoft 365 and Google Workspace are optional adapters that sync the same views; disconnect them in Integrations and everything keeps working.')+
  `<div class="tabs2">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="hubTab" data-id="${k}">${l}</button>`).join('')}</div>${body}`; };

// actions
A.calYM = id => { UI.calYM=id; render(); };
A.calDay = id => { UI.calDay=id; render(); };
A.calNew = id => { UI.calCompose = id==='x' ? false : true; if(id!=='x') UI.calDay=id; render(); };
A.evAction = id => { const [d,i]=id.split('|'); const e=S.events.filter(x=>x.d===d)[+i]; const aid='AC-0'+(S.actions.length+1); S.actions.push({id:aid,t:'Prepare for: '+e.t,owner:'u3',due:e.d,src:'Calendar · '+e.ctx,st:'Open'}); log('Calendar item converted to action',aid); save(); toast(`${aid} created`); render(); };
A.evRoom = ctx => { const rm=S.rooms.find(r=>r.ctx===ctx); if(!rm){ toast('No room linked to '+ctx+' yet'); return; } UI.room=rm.id; UI.hubTab='chat'; render(); };
A.evRoomCal = ctx => { const e=S.events.find(x=>x.ctx===ctx&&x.d>=today); UI.calDay=e?e.d:today; UI.hubTab='calendar'; render(); };
A.mailFolder = id => { UI.mailFolder=id; UI.mailSel=null; UI.mailCompose=false; render(); };
A.mailSel = id => { UI.mailSel=id; UI.mailCompose=false; const e=S.emails.find(x=>x.id===id); if(e&&e.unread){ e.unread=false; save(); } render(); };
A.mailCompose = id => { if(id==='close'){ UI.mailCompose=false; } else if(id==='draft'){ UI.mailDraft={to:$('#mTo').value,subj:$('#mSubj').value,body:$('#mBody').value}; UI.mailCompose=false; toast('Draft saved'); } else { UI.mailCompose=true; if(id==='new'){ UI.mailTo=''; UI.mailSubj=''; UI.mailBody=''; } } render(); };
A.mailReply = id => { const [eid,mode]=id.split('|'); const e=S.emails.find(x=>x.id===eid); UI.mailCompose=true; UI.mailTo=mode==='fwd'?'':e.from; UI.mailSubj=(mode==='fwd'?'FW: ':'RE: ')+e.subj; UI.mailCtx=e.ctx; UI.mailBody='\n\n---- '+(mode==='fwd'?'Forwarded':'Original')+' message ----\nFrom: '+e.from+'\nDate: '+e.date+' '+e.time+'\n\n'+e.body; render(); };
A.mailTpl = id => { const t={clar:'Dear SCM office,\n\nWith reference to the above tender, please clarify the following:\n1. …\n\nKind regards\nBids office, ABC Civil Consulting Engineers',brief:'Dear Sir/Madam,\n\nWe confirm attendance at the compulsory briefing session. Our nominated representatives are listed in the attached letter of authority.\n\nKind regards',tx:'Please find attached transmittal TX-… issuing the documents listed for the stated purpose. Kindly acknowledge receipt.\n\nKind regards\nDocument control'}[id]; $('#mBody').value=t; UI.mailBody=t; };
A.mailToAction = id => { const e=S.emails.find(x=>x.id===id); const aid='AC-0'+(S.actions.length+1); S.actions.push({id:aid,t:'Respond: '+e.subj.slice(0,60),owner:'u3',due:'2026-10-14',src:'Email '+e.id,st:'Open'}); log('Email converted to action',aid); save(); toast(`${aid} created from email`); render(); };
A.msgDecision = id => { const [rid,i]=id.split('|'); const rm=S.rooms.find(r=>r.id===rid); rm.decisions=rm.decisions||[]; rm.decisions.push(rm.msgs[+i].t.slice(0,90)); log('Message pinned as decision with evidence link',rid); save(); toast('Decision pinned'); render(); };
// ---------- extra forms (v2) ----------
document.addEventListener('submit', e => { const f=e.target;
  if(f.id==='profForm'){ e.preventDefault(); const P=S.profile; P.cidbGrade=+$('#pfGrade').value; P.cidbClass=$('#pfClass').value; P.valueMin=+$('#pfMin').value; P.valueMax=+$('#pfMax').value; P.capacityPM=+$('#pfPM').value; P.capacityEng=+$('#pfEng').value; P.version++; P.approved=true; log(`Opportunity profile v${P.version} approved; matching re-run on ${S.tenders.length} tenders`,'profile'); S.aiRuns.unshift({id:'AIR-0'+(922+S.aiRuns.length),uc:'Tender matching',ctx:'all open tenders',model:'rules + local-llm-8b v2026.09',prompt:'match-explain v4',ev:'profile v'+P.version,conf:0.88,rev:'auto · explanations regenerated',ts:today+' '+nowStamp()}); save(); toast(`Profile v${P.version} saved · ranking re-run`,'good'); render(); }
  if(f.id==='evForm'){ e.preventDefault(); S.events.push({d:$('#evD').value,t:$('#evT').value,ctx:$('#evC').value,k:$('#evK')?$('#evK').value:'internal',note:$('#evN')?$('#evN').value:''}); UI.calDay=$('#evD').value; UI.calCompose=false; log('Calendar event created'+(S.hubConnectors.m365||S.hubConnectors.google?' and synced to external calendar':''),$('#evC').value); save(); toast('Event saved to native calendar'); render(); }
  if(f.id==='chatForm'){ e.preventDefault(); const rm=S.rooms.find(r=>r.id===f.dataset.room); const v=$('#chatIn').value.trim(); if(!v) return; rm.msgs.push({who:S.people.find(p=>true).id,t:v,ts:nowStamp()}); rm.msgs[rm.msgs.length-1].who = ({pm:'u3',dl:'u1',eng:'u4',qm:'u7',dc:'u8',site:'u6',bm:'u3',tl:'u1',qs:'u5',com:'u3',md:'u2',admin:'u8',client:'u3'})[S.persona]||'u3'; log('Chat message posted',rm.id); save(); render(); }
  if(f.id==='mailForm'){ e.preventDefault(); const ctx=$('#mCtx').value; const nid='em-'+(S.emails.length+1); S.emails.unshift({id:nid,dir:'Out',from:'bids@abc-civil.co.za',name:'Bids (ABC Civil)',subj:$('#mSubj').value||'(no subject)',ctx,date:today,time:nowStamp(),unread:false,att:[],filed:true,body:$('#mBody').value+(($('#mTo').value)?'\n\n(to: '+$('#mTo').value+')':'')}); UI.mailSubj=''; UI.mailBody=''; UI.mailCompose=false; UI.mailFolder='sent'; UI.mailSel=nid; log('Outbound email sent via '+(S.hubConnectors.m365?'Microsoft Graph':S.hubConnectors.google?'Gmail API':'SMTP')+' and filed',ctx); save(); toast('Sent and filed · outbound audit recorded','good'); render(); } });

// ---------- boot ----------
S = load(); const h=(location.hash||'').slice(1); if(WORKSPACES.some(w=>w[0]===h)) S.ws=h; render();
</script>
</body>
</html>
