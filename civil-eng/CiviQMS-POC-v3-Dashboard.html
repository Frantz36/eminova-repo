<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CiviQMS standalone POC v2 client dashboard. Self-contained: works offline from any folder or OneDrive; no server required.">
<title>CiviQMS SA Client Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of 12 workspaces (horizontal tab strip on phones), sticky top bar, scrolling main pane, right-hand record drawer, toast stack. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --fg:#15202b; --fg-2:#4b5563; --muted:#7b8594;
  --line:#d9dde3; --line-2:#c6ccd5;
  --accent:#1d5fa6; --accent-ink:#ffffff; --accent-soft:#e3edf8;
  --stake:#d9661f; --stake-soft:#fbeadf;
  --good:#0f8a3c; --good-soft:#dff3e6; --warn:#b7791f; --warn-soft:#fbf0d9; --crit:#c53030; --crit-soft:#fbe1e1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s7:#4a3aa7;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --font-display:"Archivo",system-ui,sans-serif; --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail:232px; --top:56px; --radius:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#171d25; --surface-2:#1f2731; --fg:#e8ecf1; --fg-2:#b4bcc7; --muted:#8792a0;
  --line:#2a333e; --line-2:#36414e; --accent:#4f93e0; --accent-ink:#0b1420; --accent-soft:#1a2b40;
  --stake:#ef8a4a; --stake-soft:#3a2415; --good:#3fbf6f; --good-soft:#143322; --warn:#e0a23c; --warn-soft:#3a2c10; --crit:#ef6b6b; --crit-soft:#3d1a1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s7:#9085e9; --grid:#2c2c2a; --axis:#383835; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#171d25; --surface-2:#1f2731; --fg:#e8ecf1; --fg-2:#b4bcc7; --muted:#8792a0;
  --line:#2a333e; --line-2:#36414e; --accent:#4f93e0; --accent-ink:#0b1420; --accent-soft:#1a2b40;
  --stake:#ef8a4a; --stake-soft:#3a2415; --good:#3fbf6f; --good-soft:#143322; --warn:#e0a23c; --warn-soft:#3a2c10; --crit:#ef6b6b; --crit-soft:#3d1a1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s7:#9085e9; --grid:#2c2c2a; --axis:#383835; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:20px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
code,.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.tbl td.num{white-space:nowrap}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:var(--top) 1fr;height:100%;min-height:0}
.topbar{grid-column:1/3;overflow-x:auto;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;min-width:0}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px}
.brand .name{font-family:var(--font-display);font-weight:700;font-size:15px}
.brand .tag{font-size:11px;color:var(--muted);font-weight:500}
.topbar .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-2)}
.ctl select,.ctl input{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:5px 8px;max-width:200px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--surface);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.chip.offline .dot{background:var(--warn)}
.chip.is-btn:hover{border-color:var(--line-2);background:var(--surface-2)}

.rail{background:var(--surface);border-right:1px solid var(--line);overflow:auto;min-width:0;padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-height:0}
.rail .group{padding:10px 10px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tab{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);color:var(--fg-2);text-align:left;width:100%}
.tab:hover{background:var(--surface-2);color:var(--fg)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.tab .ic{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;color:var(--accent)}
.tab .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .cnt{font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 7px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.tab .cnt.hot{background:var(--crit-soft);color:var(--crit)}
.rail .foot{margin-top:auto;padding:10px;font-size:11px;color:var(--muted);line-height:1.4}

.main{overflow:auto;min-width:0;min-height:0;padding:18px 22px 40px}
.ws{display:none}
.ws.active{display:block}
.ws-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ws-head .t{flex:1;min-width:220px}
.ws-head .t p{color:var(--fg-2);margin-top:3px;max-width:68ch}
.ws-head .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius);border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.good{color:var(--good);border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}
.span3{grid-column:span 3}
.span4{grid-column:span 4}
@media (max-width:1100px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.span3,.span4{grid-column:span 2}}
@media (max-width:700px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}.span2,.span3,.span4{grid-column:span 1}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel>.ph h3{flex:1;min-width:0}
.panel>.pb{padding:14px}
.panel>.pb.tight{padding:0}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;position:relative}
.kpi:hover{border-color:var(--accent)}
.kpi.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1;display:flex;align-items:baseline;gap:8px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted);font-family:var(--font-body)}
.kpi .l{font-size:12px;color:var(--fg-2)}
.kpi .tg{font-size:11px;color:var(--muted)}
.kpi .st{position:absolute;top:12px;right:12px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.4}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.neutral{background:var(--surface-2);color:var(--fg-2)}
.pill.stake{background:var(--stake-soft);color:var(--stake)}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface-2)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl td .ref{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
.tbl .r{text-align:right}
.wide-tbl td:first-child{min-width:300px}.wide-tbl td:nth-child(2){min-width:170px}.wide-tbl td{white-space:normal}

.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fbtn{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--fg-2);background:var(--surface)}
.fbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fbtn:hover{border-color:var(--line-2)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--fg-2);font-weight:500}
.field input,.field select,.field textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:7px 9px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.form{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
@media (max-width:600px){.form{grid-template-columns:1fr}}

.note{border-left:3px solid var(--stake);background:var(--stake-soft);padding:8px 12px;border-radius:0 var(--radius) var(--radius) 0;font-size:12.5px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.crit{border-color:var(--crit);background:var(--crit-soft)}
.note.good{border-color:var(--good);background:var(--good-soft)}
.note b{font-weight:600}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-width:0}
.li:last-child{border-bottom:0}
.li.clk:hover{background:var(--surface-2)}
.li .b{flex:1;min-width:0}
.li .b .t{font-weight:500}
.li .b .s{font-size:12px;color:var(--muted)}
.li .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--line-2)}
.li .stripe.crit{background:var(--crit)}.li .stripe.warn{background:var(--warn)}.li .stripe.good{background:var(--good)}.li .stripe.info{background:var(--accent)}

/* gate strip */
.gates{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.gate{flex:1 0 74px;border:1px solid var(--line);border-radius:var(--radius);padding:8px 6px;text-align:center;background:var(--surface);min-width:74px}
.gate .g{font-family:var(--font-display);font-weight:700;font-size:13px}
.gate .d{font-size:10.5px;color:var(--muted);line-height:1.2;margin-top:2px}
.gate.passed{background:var(--good-soft);border-color:var(--good)}
.gate.passed .g{color:var(--good)}
.gate.current{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.gate.current .g{color:var(--accent)}
.gate:hover{border-color:var(--accent)}
.gate.sel{outline:2px solid var(--accent);outline-offset:1px}

/* state flow */
.flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:6px}
.flow .st{font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
.flow .st.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.flow .st.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.flow .ar{width:14px;height:1px;background:var(--line-2)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.chk:last-child{border-bottom:0}
.chk .box{width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:4px;flex:0 0 18px;display:grid;place-items:center;margin-top:1px}
.chk.on .box{background:var(--good);border-color:var(--good);color:#fff}
.chk .box svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.chk.on .box svg{display:block}
.chk .b{flex:1;min-width:0}
.chk .b .s{font-size:12px;color:var(--muted)}

/* heat matrix */
.heat{display:grid;grid-template-columns:auto repeat(5,1fr);gap:3px;font-size:11px}
.heat .h{color:var(--muted);text-align:center;padding:4px 0}
.heat .rl{color:var(--muted);padding-right:6px;text-align:right;align-self:center}
.heat .c{aspect-ratio:1.6;border-radius:4px;display:grid;place-items:center;font-weight:600;color:var(--fg);border:1px solid transparent}
.heat .c:hover{border-color:var(--fg)}
.heat .c.sel{outline:2px solid var(--fg)}
.heat .c.l1{background:var(--good-soft)}.heat .c.l2{background:var(--warn-soft)}.heat .c.l3{background:var(--stake-soft)}.heat .c.l4{background:var(--crit-soft)}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .grid line{stroke:var(--grid)}
.chart .axis{stroke:var(--axis)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar-h{display:flex;flex-direction:column;gap:7px}
.bar-h .r{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;font-size:12.5px}
.bar-h .r .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.bar-h .r .tr{height:10px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-h .r .tr i{display:block;height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.bar-h .r .vv{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:600px){.bar-h .r{grid-template-columns:100px 1fr 46px}}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.prog i.warn{background:var(--warn)}.prog i.crit{background:var(--crit)}.prog i.good{background:var(--good)}

/* phone frame for field app */
.phone{max-width:380px;margin:0 auto;border:10px solid var(--fg);border-radius:30px;background:var(--surface);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone .pstat{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:11px;color:var(--muted)}
.phone .pbody{padding:10px 14px 16px;min-height:480px;display:flex;flex-direction:column;gap:10px}
.phone .pnav{display:flex;gap:4px}
.phone .pnav button{flex:1;padding:6px;border-radius:var(--radius);font-size:12px;color:var(--fg-2);background:var(--surface-2)}
.phone .pnav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.crit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.crit-row .t{flex:1;min-width:0;font-size:13px}
.crit-row .t .s{font-size:11px;color:var(--muted)}
.pf{display:flex;gap:4px}
.pf button{padding:4px 9px;border-radius:var(--radius);border:1px solid var(--line-2);font-size:12px;font-weight:600}
.pf button.p[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.pf button.f[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.photo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo div{aspect-ratio:1;border-radius:5px;background:var(--surface-2);display:grid;place-items:center;font-size:10px;color:var(--muted);border:1px dashed var(--line-2)}
.photo div.has{background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));border-style:solid;color:var(--fg-2)}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:40;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.drawer .dh{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh .t{flex:1;min-width:0}
.drawer .dh h2{font-size:16px}
.drawer .dh .ref{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.drawer .db{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}

.audit{font-family:var(--font-mono);font-size:11.5px;line-height:1.5}
.audit div{padding:5px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:62px 1fr;gap:10px}
.audit .ts{color:var(--muted)}
.audit b{font-weight:500;color:var(--accent)}

.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;width:min(420px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:var(--radius);font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center}
.toast.crit{background:var(--crit);color:#fff}
.toast.good{background:var(--good);color:#fff}

.tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs2 button{padding:8px 12px;font-size:13px;color:var(--fg-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs2 button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.sub{display:none}.sub.active{display:block}

.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tl .e{position:relative;padding:4px 0 10px}
.tl .e::before{content:"";position:absolute;left:-16px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl .e .w{font-size:11px;color:var(--muted)}

.slider{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center}
.slider input[type=range]{width:100%}

.mailshell{display:grid;grid-template-columns:200px 320px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:560px;overflow:hidden}
.mailshell.cal{grid-template-columns:210px 1fr 300px}
.mailshell.chat{grid-template-columns:260px 1fr 220px}
.mail-folders{border-right:1px solid var(--line);padding:12px 10px;min-width:0}
.mf{display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 10px;border-radius:var(--radius);font-size:13px;color:var(--fg-2);gap:8px}
.mf:hover{background:var(--surface-2)}
.mf.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
.mfu{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;font-size:11px}
.mail-list{border-right:1px solid var(--line);overflow:auto;min-width:0;max-height:640px}
.mail-search{padding:10px;border-bottom:1px solid var(--line)}
.mail-search input{width:100%;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--fg)}
.mi{display:flex;gap:10px;width:100%;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;min-width:0;border-left:3px solid transparent}
.mi:hover{background:var(--surface-2)}
.mi.on{background:var(--accent-soft);border-left-color:var(--accent)}
.mi.unread .mn,.mi.unread .ms{font-weight:700;color:var(--fg)}
.mi.unread .mn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--fg-2);display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}
.mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mrow{display:flex;justify-content:space-between;gap:8px}
.mn{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ms{font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{display:flex;gap:4px;margin-top:3px;font-size:11px;align-items:center}
.mail-read{min-width:0;display:flex;flex-direction:column}
.mail-rh{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mail-rh h3{font-size:16px}
.mail-rh .spacer{flex:1}
.mail-body{padding:16px;font-size:14px;line-height:1.6;overflow:auto;max-width:72ch}
.mail-body p{white-space:pre-wrap}
.attach{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mail-compose{display:flex;flex-direction:column;flex:1;min-height:0}
.mail-compose .crow{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);font-size:13px}
.mail-compose .crow label{color:var(--muted)}
.mail-compose .crow input,.mail-compose .crow select{font:inherit;border:0;background:transparent;color:var(--fg);padding:4px 0;width:100%}
.mail-compose textarea{flex:1;min-height:240px;border:0;resize:vertical;padding:14px;font:inherit;background:var(--surface);color:var(--fg);line-height:1.5}
/* calendar */
.cal-side{border-right:1px solid var(--line);padding:12px 10px;min-width:0}

.cal-item i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cal-item.off{opacity:.45}
.cal-main{min-width:0;display:flex;flex-direction:column}

.cal-head .spacer{flex:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);flex:1;border-left:1px solid var(--line)}
.cal-dow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
.cal-cell{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;align-items:stretch}

.cal-cell.out{background:var(--bg);opacity:.55}
.cal-cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}

.cal-cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.cal-cell .ev{font-size:10.5px;color:#fff;border-radius:3px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal-agenda{border-left:1px solid var(--line);padding:12px 14px;overflow:auto;min-width:0}
.ag{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.agbar{width:4px;border-radius:2px;flex:0 0 4px}

.chat-main{min-width:0;display:flex;flex-direction:column}
.chat-thread{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}

.bub.me{align-self:flex-end;flex-direction:row-reverse}
.bb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.bub.me .bb{background:var(--accent-soft);border-color:transparent}

.bt{font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.bactions{display:flex;gap:10px;margin-top:4px}
.bactions button{font-size:11px;color:var(--accent)}
.chat-compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.chat-compose input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--fg)}
.chat-info{border-left:1px solid var(--line);padding:12px 14px;overflow:auto;min-width:0}

/* phone-width behaviour */
@media (max-width:860px){
  :root{--rail:0px}
  .app{grid-template-columns:1fr;grid-template-rows:var(--top) auto 1fr}
  .topbar{grid-column:1}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:4px}
  .rail .group,.rail .foot{display:none}
  .tab{width:auto;padding:6px 10px;white-space:nowrap}
  .tab .lbl{overflow:visible}
  .main{padding:14px 16px 40px}
  .topbar .hide-m{display:none}
}

function feeChart(projects){ // grouped bars: fee vs forecast per project, one scale
  const W=560,H=200,pl=52,pr=12,pt=14,pb=38; const mx=Math.ceil(Math.max(...projects.map(p=>Math.max(p.fee,p.forecast)))/5e6)*5e6;
  const cw=(W-pl-pr)/projects.length; const y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g='';
  for(let i=0;i<=4;i++){ const v=mx*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toFixed(0)}m</text>`; }
  const bars=projects.map((p,i)=>{ const x0=pl+i*cw+cw*0.18, bw=cw*0.28; return `<rect x="${x0}" y="${y(p.fee)}" width="${bw}" height="${y(0)-y(p.fee)}" rx="3" fill="var(--s1)"><title>${esc(p.name)} baseline fee ${fmtM(p.fee)}</title></rect><rect x="${x0+bw+2}" y="${y(p.forecast)}" width="${bw}" height="${y(0)-y(p.forecast)}" rx="3" fill="${p.forecast>p.fee?'var(--s2)':'var(--s3)'}"><title>Forecast ${fmtM(p.forecast)}</title></rect><text x="${pl+i*cw+cw/2}" y="${H-pb+16}" text-anchor="middle">${esc(p.id.slice(2))}</text><text x="${pl+i*cw+cw/2}" y="${H-pb+29}" text-anchor="middle">${esc(p.sector)}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Baseline fee versus forecast by project"><g class="grid">${g}</g>${bars}<line class="axis" x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}"/></svg><div class="legend"><span><i style="background:var(--s1)"></i>Baseline fee (ZAR)</span><span><i style="background:var(--s3)"></i>Forecast ≤ baseline</span><span><i style="background:var(--s2)"></i>Forecast over baseline</span></div>`; }
function burnChart(p){ // planned vs earned vs actual (fee burn) over 8 periods
  const W=560,H=190,pl=46,pr=12,pt=12,pb=26; const n=8; const prog=p.burn/p.fee; const planned=[],earned=[],actual=[];
  for(let i=0;i<=n;i++){ const t=i/n; planned.push(p.fee*Math.min(1,t*1.05)); const done=t<=prog*1.0+0.02; earned.push(done? p.earned*(t/Math.max(prog,0.01)) : null); actual.push(done? p.burn*(t/Math.max(prog,0.01)) : null); }
  const mx=p.fee*1.1; const x=i=>pl+(W-pl-pr)*i/n, y=v=>pt+(H-pt-pb)*(1-v/mx);
  const path=(arr,c,dash)=>`<path d="${arr.map((v,i)=>v==null?'':`${i===0?'M':'L'}${x(i)} ${y(Math.min(v,mx))}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2" ${dash?'stroke-dasharray="4 4"':''}/>`;
  let g=''; for(let i=0;i<=3;i++){ const v=mx*i/3; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+4}" text-anchor="end">${(v/1e6).toFixed(0)}m</text>`; }
  const lastI=actual.reduce((a,v,i)=>v!=null?i:a,0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fee burn: planned, earned and actual"><g class="grid">${g}</g>${path(planned,'var(--axis)',true)}${path(earned,'var(--s3)')}${path(actual,'var(--s2)')}<circle cx="${x(lastI)}" cy="${y(actual[lastI])}" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle cx="${x(lastI)}" cy="${y(earned[lastI])}" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/>${Array.from({length:n+1},(_,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">P${i}</text>`).join('')}</svg><div class="legend"><span><i style="background:var(--axis)"></i>Planned</span><span><i style="background:var(--s3)"></i>Earned ${fmtM(p.earned)}</span><span><i style="background:var(--s2)"></i>Actual cost ${fmtM(p.burn)}</span></div>`; }

function myTasks(){ const t=[]; const pid=S.project; const P=S.persona;
  if(['pm','md'].includes(P)){ const p=curProj(); t.push({id:'gate-'+p.id,t:`Prepare ${GATES[p.gate][0]} gate evidence – ${GATES[p.gate][1]}`,s:p.name,ws:'pcc'}); S.changes.filter(c=>c.proj===pid&&['Submitted','Impact assessed'].includes(c.state)).forEach(c=>t.push({id:'ce-'+c.id,t:`Decide change ${c.id}: ${c.title}`,s:`${fmtR(c.fee)} · ${c.days} days`,ws:'comm',drawer:['ce',c.id]})); S.risks.filter(r=>r.proj===pid&&r.state==='Overdue').forEach(r=>t.push({id:'rsk-'+r.id,t:`Overdue treatment: ${r.title}`,s:r.id,ws:'risk',drawer:['risk',r.id]})); }
  if(['dl','pm'].includes(P)) S.packages.filter(p=>p.proj===pid&&['Submitted','In Review'].includes(p.state)).forEach(p=>t.push({id:'rev-'+p.id,t:`Review design package ${p.id}`,s:p.name,ws:'design',drawer:['pkg',p.id]}));
  if(['eng','dl'].includes(P)) S.packages.filter(p=>p.proj===pid&&['Draft','Changes Required'].includes(p.state)).forEach(p=>t.push({id:'auth-'+p.id,t:`${p.state==='Draft'?'Complete and submit':'Resolve comments on'} ${p.id}`,s:`${p.comments.open} open comments · planned ${p.planned}`,ws:'design',drawer:['pkg',p.id]}));
  if(['qm','pm'].includes(P)) S.ncrs.filter(n=>n.state!=='Closed').forEach(n=>t.push({id:'ncr-'+n.id,t:`Progress ${n.id} (${n.state})`,s:n.title,ws:'quality',drawer:['ncr',n.id]}));
  if(['bm','md'].includes(P)) S.tenders.filter(t=>t.decision==='New'&&t.status==='Open'&&matchTender(t).verdict==='Recommended').forEach(t=>x_push(t));
  if(['bm','tl','com','md'].includes(P)) Object.entries(S.readiness).forEach(([tid,r])=>{ if(!r.approvals[P]&&r.status!=='Ready for bid') t.push({id:'rdy-'+tid+P,t:`Review and approve readiness pack ${tid}`,s:`${r.status} · score ${r.score}%`,ws:'ready'}); });
  if(['qs','tl'].includes(P)) { const n=S.qcands.filter(q=>q.disp==='Pending').length; if(n) t.push({id:'qc',t:`Disposition ${n} quantity candidate${n>1?'s':''}`,s:'Accept, edit or reject with evidence',ws:'drawings'}); if(S.boq&&S.boq.state!=='Approved'&&P==='qs') t.push({id:'boq',t:`Approve preliminary BOQ ${S.boq.rev}`,s:S.boq.items.length+' items',ws:'drawings'}); }
  S.actions.filter(a=>a.st==='Open'&&(P==='pm'||P==='bm')).forEach(a=>t.push({id:'act-'+a.id,t:a.t,s:`Hub action · due ${a.due}`,ws:'hub'}));
  function x_push(tn){ t.push({id:'tn-'+tn.id,t:`Decide on recommended tender ${tn.id}`,s:tn.title,ws:'tender',drawer:['tender',tn.id]}); }
  if(['dc','pm'].includes(P)) S.docs.filter(d=>d.proj===pid&&d.state==='Internal review').forEach(d=>t.push({id:'doc-'+d.id,t:`Review metadata and route ${d.rev} (internal review)`,s:d.title,ws:'cde',drawer:['doc',d.id]}));
  if(['site','pm'].includes(P)) S.itps.filter(i=>i.state==='Assigned').forEach(i=>t.push({id:'itp-'+i.id,t:`Inspect: ${i.title}`,s:`${i.type} · due ${i.due}`,ws:'field'}));
  if(['com','pm'].includes(P)) S.changes.filter(c=>c.state==='Logged').forEach(c=>t.push({id:'scr-'+c.id,t:`Screen change ${c.id}`,s:c.notice,ws:'comm',drawer:['ce',c.id]}));
  if(P==='client') S.portal.filter(x=>/Awaiting|due/.test(x.state)).forEach(x=>t.push({id:'sub-'+x.id,t:`${x.type}: ${x.item}`,s:`${x.state} · ${x.due}`,ws:'portal'}));
  if(P==='admin'){ S.people.filter(p=>p.status!=='Valid'&&p.status!=='n/a').forEach(p=>t.push({id:'reg-'+p.id,t:`Registration ${p.status.toLowerCase()}: ${p.name}`,s:`${p.reg} · ${p.expires}`,ws:'admin'})); S.integrations.filter(i=>i.s==='Warning').forEach(i=>t.push({id:'int-'+i.n,t:`Integration warning: ${i.n}`,s:i.d,ws:'admin'})); }
  if(!t.length) t.push({id:'none',t:'No open items for this persona on the selected project',s:'Switch project or persona in the top bar',ws:S.ws});
  return t; }

  const topRisks=S.risks.filter(r=>r.L*r.C>=12).sort((a,b)=>b.L*b.C-a.L*a.C).slice(0,4);
  return wsHead('Executive cockpit','Portfolio risk, profitability, capacity and client health across all active projects. Click a tile to filter the portfolio, a heatmap cell to see what drives it, and a row to open its control centre.', `<span class="chip">Example data · FY2026/27</span>`) +
  `<div class="grid g4" style="margin-bottom:14px">${kpi(S.projects.length,'Active projects','Portfolio: '+fmtM(S.projects.reduce((a,p)=>a+p.fee,0))+' fees',null,'execF','all',f==='all')}${kpi(S.projects.filter(p=>p.health!=='good').length,'Projects at risk or off track','Target: 0 off track','warn','execF','risk',f==='risk')}${kpi(S.projects.filter(p=>p.forecast>p.fee).length,'Forecast over baseline fee','Margin exposure '+fmtM(S.projects.reduce((a,p)=>a+Math.max(0,p.forecast-p.fee),0)),'crit','execF','over',f==='over')}${kpi(openNcr,'Open NCRs','Median closure target < 14 days',openNcr>3?'warn':'good','execF','quality',f==='quality')}</div>
  <div class="grid g4" style="margin-bottom:14px">${kpi(fpa+'%','First-pass approval','Target ≥ 85%',fpa>=85?'good':'warn')}${kpi(overdueRisk,'Overdue high risks','Target 0',overdueRisk?'crit':'good','goRisk','')}${kpi(S.tenders.filter(t=>t.status==='Open'&&matchTender(t).verdict==='Recommended').length,'Recommended tenders',fmtM(backlog)+' weighted proposal pipeline','info','ws','tender')}${kpi(S.people.filter(p=>p.status==='Expired').length,'Expired registrations','Approval blocked while expired',S.people.some(p=>p.status==='Expired')?'crit':'good','goAdmin','')}</div>

  else if(m==='Risk') items=S.risks.filter(r=>r.proj===pid).map(r=>`<button class="li clk" data-act="drawer" data-id="risk|${r.id}"><span class="b"><div class="t">${esc(r.id)} · score ${r.L*r.C}</div><div class="s">${esc(r.title)}</div></span></button>`);
  else if(m==='HSE') items=S.hse.filter(h=>h.proj===pid).map(h=>`<div class="li"><span class="b"><div class="t">${esc(h.id)}</div><div class="s">${esc(h.title)}</div></span>${pill(h.state,kindOf.state(h.state))}</div>`);

R.pcc = () => { const p=curProj(); const g=UI.gateSel??p.gate; const ev=GATE_EVIDENCE[g]||['Scope, assumptions and exclusions confirmed','Fee, programme and resources baselined','Registers current (risk, obligations, decisions)','Client approvals recorded','Gate review minutes attached'];

  <div class="panel"><div class="ph"><h3>Milestones</h3></div><div class="list">${p.milestones.map(m=>`<div class="li"><span class="stripe ${kindOf.ms(m.s)}"></span><span class="b"><div class="t">${esc(m.n)}</div><div class="s">${m.d}</div></span>${pill(m.s,kindOf.ms(m.s))}</div>`).join('')}</div></div>

  <div class="panel"><div class="ph"><div class="tabs2" style="margin:0;border:0">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${UI.pccTab===k}" data-act="pccTab" data-id="${k}">${l}</button>`).join('')}</div></div><div class="pb tight">${tabBody}</div></div>`; };

// ---------- tender matching: deterministic gates, then weighted score ----------
function daysLeft(closing){ const d=new Date(closing.slice(0,10)+'T00:00:00'); return Math.round((d-new Date(today+'T00:00:00'))/86400000); }
function matchTender(t){ const P=S.profile; const gates=[]; const g=(name,ok,why)=>gates.push({name,ok,why});
  g('Closing date open', t.status==='Open' && daysLeft(t.closing)>=0, t.status==='Open'?`closes ${t.closing}`:`closed ${t.closing}`);
  g('Service / sector permitted', !P.exclusions.includes(t.sector), P.exclusions.includes(t.sector)?`sector "${t.sector}" is in profile exclusions`:`sector ${t.sector}`);
  g('Geography permitted', P.provinces.includes(t.province), P.provinces.includes(t.province)?t.province:`${t.province} not in profile geography`);
  const grade=t.cidbReq?parseInt(t.cidbReq):null; g('CIDB class/grade met', !grade || (grade<=P.cidbGrade && t.cidbReq.endsWith(P.cidbClass)), grade?`requires ${t.cidbReq}; profile ${P.cidbGrade}${P.cidbClass} (max value ${fmtM(CIDB_LIMITS[P.cidbGrade])})`:'not applicable (professional services)');
  g('Compulsory briefing not missed', !t.briefingMissed, t.briefingMissed?`compulsory briefing ${t.briefing} was missed`:'ok');
  const srcDisabled=t.src.every(s=>{const x=S.sources.find(y=>y.id===s);return x&&!x.enabled;});
  const comp={}; comp.scope = P.disciplines.includes(t.disc)?1:0.3; comp.location = P.provinces.includes(t.province)?1:0; const vaultBad=S.vault.filter(v=>v.status==='Expired').length; comp.eligibility = (grade&&!(grade<=P.cidbGrade)?0:1) * (vaultBad?0.6:1);
  comp.value = (t.value>=P.valueMin&&t.value<=P.valueMax)?1:0.4; comp.capacity = P.capacityPM>=1&&P.capacityEng>=(t.value>20000000?4:2)?1:0.5; comp.strategic = P.watchlist.some(w=>t.buyer.includes(w))?1:0.4; const dl=daysLeft(t.closing); comp.deadline = dl>=14?1:dl>=7?0.6:dl>=0?0.2:0;
  const score=Math.round(Object.entries(WEIGHTS).reduce((a,[k,w])=>a+w*comp[k],0)); const failed=gates.filter(x=>!x.ok);
  let verdict='Recommended'; if(failed.length){ verdict = failed.some(f=>f.name==='Geography permitted')&&failed.length===1 ? 'Requires clarification' : 'Ineligible'; } else if(score<60) verdict='Low fit';
  const conf = t.docs>=3 ? 0.9 : 0.7; const missing = t.docs<3 ? ['document set incomplete'] : [];
  return { gates, failed, comp, score, verdict, conf, missing, srcDisabled }; }
const verdictKind = v => ({'Recommended':'good','Requires clarification':'warn','Ineligible':'crit','Low fit':'neutral'}[v]||'neutral');
const decisionKind = d => ({'Approved for analysis':'good','Rejected':'crit','Watch':'info','Clarification requested':'warn','New':'neutral'}[d]||'neutral');

  else if(tab==='email'){ body=`<div class="grid g3"><div class="panel span2"><div class="ph"><h3>Shared tender / project mailbox</h3><span class="small muted">${C.smtp?'SMTP/IMAP adapter connected':'no mail adapter'}${C.m365?' · Microsoft Graph sync on':''}${C.google?' · Gmail sync on':''}</span></div><div class="list">${S.emails.map(e=>`<div class="li"><span class="stripe ${e.dir==='Out'?'info':'good'}"></span><span class="b"><div class="t">${esc(e.subj)}</div><div class="s">${e.dir==='In'?'From':'To'} ${esc(e.from)} · ${e.date} · ${esc(e.ctx)}</div><div class="small" style="margin-top:4px">${esc(e.body)}</div></span>${e.filed?pill('Filed','good'):`<button class="btn sm" data-act="fileEmail" data-id="${e.id}">File to ${esc(e.ctx)}</button>`}</div>`).join('')}</div></div>
    <div class="panel"><div class="ph"><h3>Compose</h3></div><div class="pb"><form id="mailForm" class="form" style="grid-template-columns:1fr"><div class="field"><label for="mTo">To</label><input id="mTo" value="${UI.mailTo||'scm@kzntransport.gov.za'}"></div><div class="field"><label for="mCtx">File to</label><select id="mCtx">${[...S.tenders.filter(t=>t.status==='Open').map(t=>t.id),...S.projects.map(p=>p.id)].map(x=>`<option ${x===UI.mailCtx?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="mSubj">Subject</label><input id="mSubj" value="${esc(UI.mailSubj||'')}" placeholder="Reference number first"></div><div class="field"><label for="mBody">Body</label><textarea id="mBody">${esc(UI.mailBody||'')}</textarea></div><button class="btn pri" type="submit">Send via ${C.m365?'Microsoft Graph':C.google?'Gmail API':'SMTP'} & file</button><p class="small muted">Outbound mail is audited. Templates: clarification, briefing confirmation, transmittal cover.</p></form></div></div></div>`; }
  else if(tab==='actions'){ body=`<div class="panel"><div class="ph"><h3>Actions</h3><span class="small muted">converted from messages, email, calendar items and readiness gaps</span></div><div class="pb tight">${tbl([{h:'Action'},{h:'Owner'},{h:'Due'},{h:'Source'},{h:'State'},{h:''}],S.actions.map(a=>`<tr><td><span class="ref">${a.id}</span> ${esc(a.t)}</td><td>${esc(person(a.owner).name)}</td><td class="num" style="${a.due<today&&a.st==='Open'?'color:var(--crit)':''}">${a.due}</td><td class="small">${esc(a.src)}</td><td>${pill(a.st,a.st==='Done'?'good':'warn')}</td><td>${a.st==='Open'?`<button class="btn sm" data-act="actionDone" data-id="${a.id}">Mark done</button>`:''}</td></tr>`))}</div></div>`; }
  else { const rows=[['smtp','SMTP / IMAP (generic mail)','Native path · required',true],['caldav','CalDAV / iCalendar','Native path · required',true],['m365','Microsoft 365 (Graph mail & calendar)','Optional edge adapter · OAuth, no stored passwords',false],['google','Google Workspace (Gmail & Calendar API)','Optional edge adapter · incremental OAuth scopes',false]];
    body=`<div class="grid g2"><div class="panel"><div class="ph"><h3>Connectors</h3></div><div class="list">${rows.map(([k,n,d,req])=>`<div class="li"><span class="b"><div class="t">${n}</div><div class="s">${d}</div></span><button class="btn sm ${C[k]?'good':''}" data-act="hubConn" data-id="${k}">${C[k]?'Connected · disconnect':'Connect'}</button></div>`).join('')}</div></div>
    <div class="panel"><div class="ph"><h3>Independence check (NFR-01)</h3></div><div class="pb"><div class="note ${!C.m365&&!C.google?'good':'info'}"><b>${!C.m365&&!C.google?'Standalone mode.':'Optional adapters active.'}</b> Calendar, chat, email composition/history, actions, approvals and documents all run natively. ${!C.m365&&!C.google?'No Microsoft or Google tenant, licence or API is configured; every workflow in this demo still executes (acceptance scenario A1/A10).':'Disconnecting both adapters does not reduce any capability; externally owned fields follow the external source, CiviQMS metadata stays local.'}</div><dl class="kv" style="margin-top:12px"><dt>Identity</dt><dd>Keycloak local users + MFA; federation optional</dd><dt>Chat</dt><dd>Matrix homeserver (self-hosted)</dd><dt>Mail</dt><dd>${C.m365?'Graph + SMTP':C.google?'Gmail API + SMTP':'SMTP/IMAP only'}</dd><dt>Calendar</dt><dd>${C.m365?'Graph + CalDAV':C.google?'Google Calendar + CalDAV':'Native + CalDAV'}</dd><dt>Connector failure policy</dt><dd>Never blocks native work; retry with back-off → dead-letter queue</dd></dl></div></div></div>`; }
  return wsHead('Communications hub','Native calendar, chat, email centre, activity stream and actions, persisted in CiviQMS with retention and access control. Microsoft 365 and Google Workspace are optional edge adapters: disconnect them in Integrations and every function here keeps working.')+
  `<div class="tabs2">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-act="hubTab" data-id="${k}">${l}</button>`).join('')}</div>${body}`; };
R.cde = () => { const p=curProj(); const f=UI.docF; const ds=S.docs.filter(d=>d.proj===p.id&&(f==='all'||d.state===f));
  const cnt=s=>S.docs.filter(d=>d.proj===p.id&&d.state===s).length;
  const rows=ds.map(d=>`<tr class="row" data-act="drawer" data-id="doc|${d.id}"><td><span class="ref">${esc(d.id)}</span><br>${esc(d.title)}</td><td>${esc(d.type)}</td><td class="mono">${esc(d.rev)}</td><td class="small">${esc(d.suit)}</td><td>${pill(d.state,kindOf.state(d.state))}</td><td>${pill(d.class,d.class==='Client'?'info':'neutral')}</td><td>${esc(person(d.owner).name)}</td><td class="num">${d.date}</td></tr>`);
  return wsHead('CDE console','v2 document status model (working draft → internal review → client review → approved → issued for tender / construction → as-built → superseded) with ISO 19650 metadata, suitability codes and transmittals. Documents are append-only versions: a new hash is a new version. Open a document to move it through its allowed transitions.',`<button class="btn" data-act="ws" data-id="design">Design packages</button><button class="btn pri" data-act="newTx">+ Transmittal</button>`)+
  `<div class="grid g4" style="margin-bottom:14px">${DOC_STATES.map(s=>kpi(cnt(s),s,{'Working draft':'Author-controlled, not for reliance','Internal review':'Peer / discipline / QMS review','Client review':'Issued for comment, not construction','Approved':'Approved for stated purpose','Issued for Tender':'Tender-controlled package','Issued for Construction':'Construction-controlled package','As-built / record':'Final verified record','Superseded':'Not current; retained for history'}[s],null,'docF',s,f===s)).join('')}</div>
  <div class="grid g3"><div class="panel span2"><div class="ph"><h3>Document register · ${esc(p.id)}</h3><div class="filters"><button class="fbtn" aria-pressed="${f==='all'}" data-act="docF" data-id="all">All</button>${DOC_STATES.map(s=>`<button class="fbtn" aria-pressed="${f===s}" data-act="docF" data-id="${s}">${s}</button>`).join('')}</div></div><div class="pb tight">${tbl([{h:'Document'},{h:'Type'},{h:'Rev'},{h:'Suitability'},{h:'State'},{h:'Class'},{h:'Owner'},{h:'Date'}],rows)}</div></div>
  <div class="panel"><div class="ph"><h3>Transmittals</h3></div><div class="list">${S.transmittals.filter(t=>t.proj===p.id).map(t=>`<div class="li"><span class="stripe ${t.ack?'good':'warn'}"></span><span class="b"><div class="t mono">${t.id}</div><div class="s">${esc(t.to)} · ${t.docs} doc(s) · ${esc(t.purpose)}</div></span>${pill(t.ack?'Acknowledged':'Sent',t.ack?'good':'info')}</div>`).join('')||'<div class="li small muted">No transmittals yet.</div>'}</div><div class="pb"><div class="eyebrow" style="margin-bottom:6px">Numbering convention</div><code>PROJ-ORIG-VOL-LVL-TYPE-ROLE-NNNN</code><p class="small muted" style="margin-top:6px">e.g. N2U-ABC-ZZ-XX-DR-S-2101 → N2 Umhlanga · originator ABC · drawing · structures. Metadata dictionary is a controlled template.</p></div></div></div>`; };

R.field = () => { const itps=S.itps.filter(i=>i.state==='Assigned'); const cur=S.itps.find(i=>i.id===UI.fieldItp)||itps[0];
  const tabs=[['inspect','Inspections'],['diary','Site diary'],['sync','Sync']];
  let body='';
  if(UI.fieldTab==='inspect'){ if(!cur) body=`<div class="note good">All assigned inspections completed. New work downloads when assigned.</div>`; else { const allAns=cur.items.every(i=>i.r); const fails=cur.items.filter(i=>i.r==='F').length;
    body=`<div class="field"><label for="itpPick">Assigned work (downloaded)</label><select id="itpPick" data-act-change="fieldItp">${itps.map(i=>`<option value="${i.id}" ${i.id===cur.id?'selected':''}>${i.id} · ${esc(i.title)}</option>`).join('')}</select></div>
    <div><div style="display:flex;justify-content:space-between;align-items:center"><strong>${esc(cur.title)}</strong>${pill(cur.type,cur.type==='Hold point'?'crit':cur.type==='Witness point'?'warn':'info')}</div><div class="small muted">${esc(cur.loc)} · due ${cur.due} · ref drawings current as of download</div></div>
    <div>${cur.items.map((it,i)=>`<div class="crit-row"><span class="t"><div>${esc(it.t)}</div><div class="s">${esc(it.m)}</div></span><span class="pf"><button class="p" aria-pressed="${it.r==='P'}" data-act="itpRes" data-id="${cur.id}|${i}|P">Pass</button><button class="f" aria-pressed="${it.r==='F'}" data-act="itpRes" data-id="${cur.id}|${i}|F">Fail</button></span></div>`).join('')}</div>
    <div><div class="eyebrow" style="margin-bottom:6px">Photos · geotagged</div><div class="photo">${[0,1,2].map(i=>`<button ${i<cur.photos?'class="has"':''} data-act="photo" data-id="${cur.id}">${i<cur.photos?'📷 IMG_'+(1040+i)+'<br>-29.72, 31.07':'+ add'}</button>`).join('').replace(/<button /g,'<div role="button" tabindex="0" ').replace(/<\/button>/g,'</div>')}</div></div>
    ${fails?`<div class="note crit"><b>${fails} criterion failed.</b> Submitting creates an NCR automatically and keeps the ${cur.type.toLowerCase()} unreleased.</div>`:''}
    <button class="btn pri" style="justify-content:center" data-act="itpSubmit" data-id="${cur.id}" ${allAns?'':'disabled'}>${allAns?(S.net?'Sign & submit':'Sign & queue (offline)'):'Answer every criterion to sign'}</button>`; } }
  else if(UI.fieldTab==='diary'){ const d=S.diary[0]; body=`<div class="small muted">${d.d} · ${esc(d.proj)}</div><dl class="kv"><dt>Weather</dt><dd>${esc(d.w)}</dd><dt>Labour</dt><dd>${d.labour} on site</dd><dt>Plant</dt><dd>${esc(d.plant)}</dd><dt>Notes</dt><dd>${esc(d.note)}</dd></dl><div class="field"><label for="diaryNote">Add entry</label><textarea id="diaryNote" placeholder="Progress, instructions given, delays, visitors…"></textarea></div><button class="btn" data-act="diaryAdd">Save entry${S.net?'':' (queued)'}</button>`; }
  else { body=`<div class="note ${S.net?'good':''}"><b>${S.net?'Connected':'Offline mode'}.</b> ${S.net?'Changes sync immediately. Download refreshed references before leaving coverage.':'Edits are stored on the device, filtered to your project, date window and work package. They upload with conflict handling when connectivity returns.'}</div>
    <div><div class="eyebrow" style="margin-bottom:6px">Outbox · ${S.outbox.length}</div><div class="list" style="border:1px solid var(--line);border-radius:6px">${S.outbox.map(o=>`<div class="li"><span class="stripe warn"></span><span class="b"><div class="t">${esc(o.t)}</div><div class="s">${esc(o.s)}</div></span></div>`).join('')||'<div class="li small muted">Nothing waiting to sync.</div>'}</div></div>
    <button class="btn pri" data-act="sync" ${S.net&&S.outbox.length?'':'disabled'}>${S.net?'Sync now':'Reconnect to sync'}</button><button class="btn" data-act="net">${S.net?'Simulate loss of signal':'Simulate signal restored'}</button>`; }
  return wsHead('Field app (offline)','Power Apps canvas mobile for inspections, ITP hold/witness points, site diary, photos and signatures on low-connectivity sites. A failed criterion raises an NCR in the Quality hub and blocks hold-point release. Use the connectivity toggle (top bar) to see the offline outbox.',`<button class="btn" data-act="net">${S.net?'Go offline':'Go online'}</button>`)+
  `<div class="grid g3"><div class="span2"><div class="phone"><div class="pstat"><span>09:41</span><span>${S.net?'LTE ▲▲▲':'No service ✕'} · 71%</span></div><div class="pbody"><div class="pnav">${tabs.map(([k,l])=>`<button aria-pressed="${UI.fieldTab===k}" data-act="fieldTab" data-id="${k}">${l}</button>`).join('')}</div>${body}</div></div></div>
  <div class="panel"><div class="ph"><h3>Field KPIs · all sites</h3></div><div class="pb">${tbl([{h:'Measure'},{h:'Value',r:1}],[['Inspections due this week',S.itps.filter(i=>i.state==='Assigned').length],['Hold points awaiting release',S.itps.filter(i=>i.state==='Assigned'&&i.type==='Hold point').length],['Failed tests → NCR (30 d)',S.ncrs.filter(n=>n.source==='ITP hold point'||n.source==='Field inspection').length],['Photos pending review','3'],['Mobile sync success','98.6%'],['Contractor response ageing','4.2 days']].map(r=>`<tr><td>${r[0]}</td><td class="r num">${r[1]}</td></tr>`))}<div class="note info" style="margin-top:12px"><b>Construction Regulations 2014.</b> Safety file, appointments and permit evidence are linked from the inspection record, not stored on the device beyond the offline profile [8].</div></div></div></div>`; };

R.comm = () => { const p=curProj(); const cs=S.changes.filter(c=>c.proj===p.id); const limit=S.doa; const who=PERSONAS.find(x=>x[0]===S.persona)[1];
  const rows=cs.map(c=>`<tr class="row" data-act="drawer" data-id="ce|${c.id}"><td><span class="ref">${c.id}</span><br>${esc(c.title)}</td><td>${esc(c.trigger)}</td><td class="r num">${fmtR(c.fee)}</td><td class="r num">${c.days}</td><td class="small">${esc(c.notice)}</td><td>${pill(c.state,kindOf.state(c.state))}</td></tr>`);
  const approvedFee=cs.filter(c=>['Approved','Implemented','Verified'].includes(c.state)).reduce((a,c)=>a+c.fee,0); const pendingFee=cs.filter(c=>!['Approved','Implemented','Verified'].includes(c.state)).reduce((a,c)=>a+c.fee,0);
  const tabs=[['changes','Change & variation'],['budget','Budget & forecast'],['obl','Obligations & notices']]; let body='';
  if(UI.commTab==='changes') body=`<div class="panel"><div class="ph"><h3>Change events · ${esc(p.id)}</h3><button class="btn sm" data-act="newCe">+ Log change</button></div><div class="pb tight">${tbl([{h:'Change event'},{h:'Trigger'},{h:'Fee impact',r:1},{h:'Days',r:1},{h:'Notice / authority'},{h:'State'}],rows)}</div><div class="pb"><div class="note"><b>Delegation of authority.</b> PM ≤ ${fmtR(limit.pm)} · Director ≤ ${fmtR(limit.director)} · Board above. Limits are configured in Administration; an approval above the acting persona's limit is refused, not silently escalated.</div></div></div>`;
  else if(UI.commTab==='budget') body=`<div class="grid g2"><div class="panel"><div class="ph"><h3>Fee position</h3></div><div class="pb">${tbl([{h:'Line'},{h:'ZAR',r:1}],[['Original appointment fee',fmtR(p.fee)],['Approved variations',fmtR(approvedFee)],['Current baseline',fmtR(p.fee+approvedFee)],['Pending change events',fmtR(pendingFee)],['Actual cost to date',fmtR(p.burn)],['Earned value',fmtR(p.earned)],['Estimate at completion',fmtR(p.forecast)],['Variance at completion',fmtR(p.fee+approvedFee-p.forecast)]].map((r,i)=>`<tr><td ${i===2||i===6?'style="font-weight:600"':''}>${r[0]}</td><td class="r num" ${i===7?`style="color:${p.fee+approvedFee-p.forecast<0?'var(--crit)':'var(--good)'}"`:''}>${r[1]}</td></tr>`))}</div></div>
    <div class="panel"><div class="ph"><h3>Invoice support</h3></div><div class="pb"><p class="small" style="margin-bottom:10px">Progress certificates draw on earned deliverables (Design control) and approved variations. ERP (Sage Intacct) remains the ledger of record; nightly reconciliation flags differences.</p>${tbl([{h:'Invoice'},{h:'Period'},{h:'Amount',r:1},{h:'Status'}],[['INV-0471','Sep 2026',fmtR(1140000),pill('Certified','good')],['INV-0462','Aug 2026',fmtR(1310000),pill('Paid','good')],['INV-0455','Jul 2026',fmtR(1225000),pill('Paid','good')]].map(r=>`<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="r num">${r[2]}</td><td>${r[3]}</td></tr>`))}</div></div></div>`;
  else body=`<div class="panel"><div class="ph"><h3>Obligation register · ${esc(p.contract)}</h3></div><div class="pb tight">${tbl([{h:'Obligation'},{h:'Source'},{h:'Time bar'},{h:'Owner'},{h:'Status'}],[['Early warning of events affecting cost/time',p.contract+' cl.5.12 / 15','Within 7 days of awareness','PM',pill('Compliant','good')],['Monthly progress report to Employer','Appointment letter §6.2','5th of each month','PM',pill('Compliant','good')],['Professional indemnity cover R 20 m','Appointment §9','Annual renewal evidence','Commercial',pill('Expiring 2026-11','warn')],['Design certification by registered person','ECSA IDoEW / EPA s.26','Before issue of each package','Design lead',pill('Blocked – reg. expired','crit')],['Safety file contribution (design risk)','CR 2014 reg 6(1)(b)','Before construction','HSE',pill('Open','warn')]].map(r=>`<tr><td>${r[0]}</td><td class="small">${r[1]}</td><td class="small">${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`))}</div></div>`;
  return wsHead('Commercial control','Appointment, budget, forecast, instruction, change, variation, claims and invoice support. Change events carry technical, schedule, fee, risk and contractual impacts and cannot alter a baseline without delegated approval. You are acting as <b>'+esc(who)+'</b>.',`${pill('Baseline '+fmtM(p.fee+approvedFee),'info')}`)+
  `<div class="grid g4" style="margin-bottom:14px">${kpi(fmtM(p.fee+approvedFee),'Current baseline','Original + approved variations')}${kpi(fmtM(pendingFee),'Pending change value',cs.filter(c=>!['Approved','Implemented','Verified'].includes(c.state)).length+' events awaiting decision','warn')}${kpi((p.earned/p.burn).toFixed(2),'Cost performance (CPI)','Earned ÷ actual',p.earned/p.burn<1?'crit':'good')}${kpi(fmtM(p.forecast),'Estimate at completion',p.forecast>p.fee+approvedFee?'Over baseline by '+fmtM(p.forecast-p.fee-approvedFee):'Within baseline',p.forecast>p.fee+approvedFee?'crit':'good')}</div>
  <div class="tabs2">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${UI.commTab===k}" data-act="commTab" data-id="${k}">${l}</button>`).join('')}</div>${body}`; };

R.risk = () => { const tabs=[['risks','Risk register'],['hse','HSE & environment'],['compliance','SA compliance matrix'],['reg','Registrations']]; let body='';
  const sel=UI.heatRisk; const rs=S.risks.filter(r=>!sel||(r.L===sel[0]&&r.C===sel[1]));
  if(UI.riskTab==='risks'){ const cell=(L,C)=>{const n=S.risks.filter(r=>r.L===L&&r.C===C).length; const s=L*C; const lvl=s>=15?4:s>=10?3:s>=5?2:1; return `<button class="c l${lvl} ${sel&&sel[0]===L&&sel[1]===C?'sel':''}" data-act="heatRisk" data-id="${L}|${C}" title="Likelihood ${L} × consequence ${C}">${n||''}</button>`;};

  else if(UI.riskTab==='compliance'){ const rows=[['Engineering Profession Act / ECSA IDoEW','Registered-person record, category, discipline, scope, expiry, supervision and approval rule','Engineering director / legal',S.people.some(p=>p.status==='Expired')?['Gap – 1 expired approver','crit']:['Configured','good']],['SACPCMP (PM / CM professions)','Category and status for roles where required; appointment evidence','Operations / legal',['Expiring – 1 renewal due','warn']],['POPIA and PAIA','Information Officer, processing inventory, access/correction workflow, retention, PAIA records','Information Officer',['Configured','good']],['CIDB / public-sector procurement','Tender templates, contractor grading, prescribed process checks, tender audit record','Commercial / SCM',['Configured','good']],['OHS Act Construction Regulations 2014','Appointments, H&S specification and plan, permit, safety file, induction evidence','HSE professional',['1 open high observation','warn']],['NEMA / environmental approvals','Authorisation register, conditions, monitoring, incident escalation, close-out','Environmental practitioner',['Compliant','good']],['COTO road & bridge specifications','Applicable chapter/version, ITP criteria, testing, calibration and acceptance evidence','Roads discipline lead',['Configured','good']],['Contract conditions (FIDIC / NEC / GCC / PROCSA)','Notices, time bars, communication types, authority and change paths','Commercial / legal',['Configured','good']]];
    body=`<div class="panel"><div class="ph"><h3>South African compliance configuration</h3><span class="small muted">validated by competent professionals before release</span></div><div class="pb tight">${tbl([{h:'Area'},{h:'Product control'},{h:'Validation owner'},{h:'Status'}],rows.map(r=>`<tr><td style="font-weight:500">${r[0]}</td><td class="small">${r[1]}</td><td class="small">${r[2]}</td><td>${pill(r[3][0],r[3][1])}</td></tr>`))}</div><div class="pb"><div class="note info"><b>AI guardrails.</b> AI features are off by default for sensitive content; Power Platform generative-AI for South Africa may process prompts outside the region if cross-region movement is enabled, so each use case is approved through the POPIA and classification assessment first [15].</div></div></div>`; }
  else body=`<div class="panel"><div class="ph"><h3>Professional registrations and authority</h3></div><div class="pb tight">${tbl([{h:'Person'},{h:'Role'},{h:'Body'},{h:'Category'},{h:'Expires'},{h:'Status'},{h:''}],S.people.filter(x=>x.body!=='—').map(x=>`<tr><td>${esc(x.name)}</td><td class="small">${esc(x.role)}</td><td>${esc(x.body)}</td><td class="small">${esc(x.cat)}</td><td class="num">${x.expires}</td><td>${pill(x.status,kindOf.state(x.status))}</td><td>${x.status!=='Valid'?`<button class="btn sm" data-act="renew" data-id="${x.id}">Record renewal evidence</button>`:''}</td></tr>`))}</div><div class="pb"><div class="note crit"><b>Approval block.</b> When a registration is expired the person cannot approve regulated work anywhere in the platform; approvals route to a substitute authority and the event is audited. Lookup against ECSA/SACPCMP is a dated manual verification record until an authorised API exists.</div></div></div>`;
  return wsHead('Risk, HSE & compliance','Enterprise, project and design risk (ISO 31000), HSE and environmental obligations (OHS Act, NEMA), and the South African regulatory configuration (ECSA, SACPCMP, POPIA, CIDB, COTO). Registrations here drive the approval rules used in Design control and the gates.')+
  `<div class="grid g4" style="margin-bottom:14px">${kpi(S.risks.filter(r=>r.state==='Overdue').length,'Overdue high risks','Target 0',S.risks.some(r=>r.state==='Overdue')?'crit':'good')}${kpi(S.hse.filter(h=>h.state==='Open'&&h.sev==='High').length,'Open high HSE items','Critical actions past due: 0 target','warn')}${kpi(S.people.filter(p=>p.status==='Expired').length,'Expired registrations',S.people.filter(p=>p.status==='Expiring').length+' expiring within 60 days',S.people.some(p=>p.status==='Expired')?'crit':'good')}${kpi('1','Environmental authorisation','Conditions monitored monthly','good')}</div>

    <div class="panel"><div class="ph"><h3>Security roles (Dataverse)</h3></div><div class="pb tight">${tbl([{h:'Role'},{h:'Scope'},{h:'Key rights'}],[['Project team member','Own projects','Create WIP, comment, submit'],['Design approver','Discipline + registration','Approve only when registration valid'],['Document controller','Project','Publish, transmit, supersede, archive'],['Quality manager','Organisation','NCR/CAPA, audits, template release'],['External – client','Named project','Read Published addressed to org; submit'],['External – contractor','Named contract','Submit, RFI, read Published for construction'],['System administrator','Environment','Config, no access to record content by default']].map(r=>`<tr><td style="font-weight:500">${r[0]}</td><td class="small">${r[1]}</td><td class="small">${r[2]}</td></tr>`))}</div></div></div>`;
  else if(UI.adminTab==='integ') body=`<div class="panel"><div class="ph"><h3>Integration status</h3></div><div class="pb tight">${tbl([{h:'System'},{h:'Status'},{h:'Detail'}],S.integrations.map(i=>`<tr><td style="font-weight:500">${esc(i.n)}</td><td>${pill(i.s,kindOf.state(i.s))}</td><td class="small">${esc(i.d)}</td></tr>`))}</div><div class="pb"><div class="note info"><b>Pattern.</b> API Management + Functions + Service Bus; versioned APIs, retries, reconciliation; files stay in the authoring/CDE platform; one system-of-record matrix avoids duplicate masters.</div></div></div>`;
  else if(UI.adminTab==='audit') body=`<div class="panel"><div class="ph"><h3>Append-only audit trail (this session)</h3><span class="small muted">${S.audit.length} events</span></div><div class="pb"><div class="audit">${S.audit.map(a=>`<div><span class="ts">${a.ts}</span><span><b>${esc(a.who)}</b> ${esc(a.action)} <span class="muted">${esc(a.ref)}</span>${a.detail?` — ${esc(a.detail)}`:''}</span></div>`).join('')||'<div><span class="ts">—</span><span class="muted">No events yet. Every state change in any workspace is written here with user, time and record reference (Dataverse auditing [10]).</span></div>'}</div></div></div>`;
  else body=`<div class="grid g2"><div class="panel"><div class="ph"><h3>Environments</h3></div><div class="pb tight">${tbl([{h:'Environment'},{h:'Region'},{h:'Purpose'},{h:'Solution'}],[['DEV','Docker Compose · developer host','Configuration & feature work','civiqms:2026.11-dev'],['TEST','Docker Compose · SA private cloud (Johannesburg)','UAT, acceptance scenarios A1–A15','civiqms:2026.10.1'],['PROD (option)','Kubernetes · SA hosting provider or on-prem','HA, DR, WAF, managed secrets','civiqms:2026.10.0']].map(r=>`<tr><td class="mono">${r[0]}</td><td class="small">${r[1]}</td><td class="small">${r[2]}</td><td class="small mono">${r[3]}</td></tr>`))}</div></div>
    <div class="panel"><div class="ph"><h3>Non-functional targets</h3></div><div class="pb tight">${tbl([{h:'Attribute'},{h:'Target'},{h:'Current',r:1}],[['NFR-01 Independence','no Microsoft/Google tenant configured','passes (A1)'],['NFR-04 Performance (p95)','< 3 s interactive','2.1 s'],['NFR-06 Reliability','idempotent ingestion, no duplicates','dedupe tests pass'],['NFR-09 Explainability','source + confidence on every AI field','100%'],['NFR-13 Interoperability','OpenAPI, OIDC, SMTP/IMAP, CalDAV, IFC','documented'],['NFR-15 Recoverability','backup/restore of DB, objects, identity, workflow','tested 2026-09']].map(r=>`<tr><td>${r[0]}</td><td class="small">${r[1]}</td><td class="r num small">${r[2]}</td></tr>`))}</div></div></div>`;
