<title>EMINOVA HR &amp; Payroll Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: operator workbench — fixed left rail of 14 workspaces, top command bar, scrolling work surface. Jacaranda accent on aubergine ink; teal for money. */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --surface-2:#FAF9FC; --line:#E3E1EA; --line-2:#EFEDF4;
  --ink:#1A1730; --muted:#5F6577; --faint:#8C8FA0;
  --nav:#1B1530; --nav-ink:#CFC9E6; --nav-muted:#8A82A8; --nav-hover:#2A2245;
  --accent:#6A4FB3; --accent-ink:#FFFFFF; --accent-soft:#EEEAF8; --accent-line:#D6CCF0;
  --money:#1F7A6D; --money-soft:#E5F3F0;
  --ok:#2F7D4F; --ok-soft:#E6F4EC; --warn:#A8670F; --warn-soft:#FBF1DF; --bad:#B42318; --bad-soft:#FCEBE9; --info:#2A6496; --info-soft:#E7F0F8;
  --ev-deadline:#B42318; --ev-briefing:#2A6496; --ev-gate:#6A4FB3; --ev-audit:#A8670F; --ev-milestone:#1F7A6D;
  --shadow:0 10px 30px rgba(26,23,48,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1B1826; --surface-2:#211D2F; --line:#302B44; --line-2:#272237;
  --ink:#ECEAF3; --muted:#A9A5BC; --faint:#7F7A95;
  --nav:#0C0A13; --nav-ink:#CFC9E6; --nav-muted:#7C7499; --nav-hover:#1F1A30;
  --accent:#A68CEB; --accent-ink:#140F24; --accent-soft:#2A2342; --accent-line:#463A6E;
  --money:#5CC2B0; --money-soft:#16302C;
  --ok:#6BC28E; --ok-soft:#17301F; --warn:#E3A84D; --warn-soft:#33270F; --bad:#F08A7E; --bad-soft:#3A1815; --info:#7FB3E0; --info-soft:#152A3C;
  --ev-deadline:#D0574A; --ev-briefing:#3F7DB3; --ev-gate:#8467CF; --ev-audit:#B98328; --ev-milestone:#2E9483;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1B1826; --surface-2:#211D2F; --line:#302B44; --line-2:#272237;
  --ink:#ECEAF3; --muted:#A9A5BC; --faint:#7F7A95;
  --nav:#0C0A13; --nav-ink:#CFC9E6; --nav-muted:#7C7499; --nav-hover:#1F1A30;
  --accent:#A68CEB; --accent-ink:#140F24; --accent-soft:#2A2342; --accent-line:#463A6E;
  --money:#5CC2B0; --money-soft:#16302C;
  --ok:#6BC28E; --ok-soft:#17301F; --warn:#E3A84D; --warn-soft:#33270F; --bad:#F08A7E; --bad-soft:#3A1815; --info:#7FB3E0; --info-soft:#152A3C;
  --ev-deadline:#D0574A; --ev-briefing:#3F7DB3; --ev-gate:#8467CF; --ev-audit:#B98328; --ev-milestone:#2E9483;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.r{text-align:right}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--nav)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--nav);color:#fff;display:flex;align-items:center;gap:14px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand b{font-family:var(--f-display);font-size:16px;letter-spacing:.2px;display:block;line-height:1.15}
.brand small{font-size:11px;color:var(--nav-muted);display:block}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top label{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--nav-muted);font-weight:600}
.top select{background:var(--nav-hover);border:1px solid #3B3360;color:#fff;border-radius:7px;padding:6px 8px;font-size:12.5px;max-width:240px}
.top select option{color:#1A1730;background:#fff}
.tbtn{background:transparent;border:1px solid #3B3360;color:#E6E1F7;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
.tbtn:hover{background:var(--nav-hover)}
.pill-poc{font-family:var(--f-mono);font-size:10.5px;background:var(--accent);color:var(--accent-ink);padding:4px 8px;border-radius:5px;font-weight:600}

/* ---------- shell ---------- */
.shell{display:flex;min-height:calc(100% - 56px);background:linear-gradient(to right,var(--nav) 214px,transparent 214px)}
.rail{width:214px;flex:none;background:var(--nav);color:var(--nav-ink);padding:8px 0 24px;position:sticky;top:56px;align-self:flex-start;max-height:calc(100vh - 56px);overflow-y:auto}
.rail .grp{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--nav-muted);font-weight:600;padding:14px 18px 5px}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-left:3px solid transparent;color:var(--nav-ink);padding:7px 15px;font-size:13px;cursor:pointer;text-align:left}
.nav:hover{background:var(--nav-hover);color:#fff}
.nav.on{background:var(--nav-hover);border-left-color:var(--accent);color:#fff;font-weight:600}
.nav .n{font-family:var(--f-mono);font-size:10px;color:var(--nav-muted);width:18px;flex:none}
.nav .cnt{margin-left:auto;font-size:10px;font-family:var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:1px 6px}
.nav .new{margin-left:auto;font-size:9px;letter-spacing:.6px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.railfoot{font-size:11px;color:var(--nav-muted);padding:16px 18px 0;line-height:1.55}
main{flex:1;min-width:0;padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ---------- headings / layout ---------- */
.vh{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vh .t{min-width:0;flex:1 1 380px}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);font-weight:700}
.vh h1{font-family:var(--f-display);font-size:26px;line-height:1.15;margin-top:2px}
.vh p{margin:5px 0 0;color:var(--muted);max-width:76ch}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g64{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g46{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g64,.g46{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.g2,.g4{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch h3{font-size:14px;font-weight:600}
.ch .sp{margin-left:auto}
.ch .hint{font-size:12px;color:var(--muted)}
.cb{padding:14px 16px}
.cb.tight{padding:0}

/* KPI tiles */
.kpi{padding:13px 16px}
.kpi .l{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)} .kpi.money .v{color:var(--money)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.money{background:var(--money);border-color:var(--money);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.xs{padding:2px 7px;font-size:11px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* badges */
.b{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--line-2);color:var(--muted)}
.b.ok{background:var(--ok-soft);color:var(--ok)} .b.warn{background:var(--warn-soft);color:var(--warn)} .b.bad{background:var(--bad-soft);color:var(--bad)}
.b.info{background:var(--info-soft);color:var(--info)} .b.acc{background:var(--accent-soft);color:var(--accent)} .b.money{background:var(--money-soft);color:var(--money)}

/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:var(--surface-2)}
.t td.wrap{min-width:220px}
.t td.nw{white-space:nowrap}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface-2)}

/* forms */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:13px}
.f textarea{resize:vertical;min-height:70px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* state machine track */
.track{display:flex;gap:4px;overflow-x:auto;padding:14px 16px}
.st{flex:1 0 96px;min-width:96px;border-radius:7px;padding:8px 8px;font-size:11px;font-weight:600;text-align:center;background:var(--line-2);color:var(--faint);border:1px solid transparent;line-height:1.25}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.cur{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}

/* list rows */
.li{display:flex;gap:11px;padding:10px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.li .bd{flex:1;min-width:0}
.li .bd b{display:block;font-size:13px}
.li .bd span{font-size:12px;color:var(--muted)}
.sev{width:4px;align-self:stretch;border-radius:3px;flex:none;background:var(--line)}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.ok{background:var(--ok)} .sev.info{background:var(--info)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* bars */
.bar{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.money{background:var(--money)}

/* checklist */
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{width:18px;height:18px;border:1.5px solid var(--faint);border-radius:5px;flex:none;margin-top:1px;display:grid;place-items:center;font-size:12px;color:#fff}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .tx{color:var(--muted);text-decoration:line-through}
.chk.lock{cursor:not-allowed;opacity:.6}

/* modal + drawer + toast */
.veil{position:fixed;inset:0;background:rgba(15,12,28,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:calc(40px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{font-family:var(--f-display);font-size:18px}
.mh .x{margin-left:auto;background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--nav);color:#fff;border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);border-left:4px solid var(--accent);animation:tin .25s ease}
.toast.bad{border-left-color:#F08A7E} .toast.ok{border-left-color:#6BC28E}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.note{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px}
.callout{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:10px;padding:12px 16px;font-size:13px}
.callout b{color:var(--accent)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)} .callout.bad b{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.trace{font-family:var(--f-mono);font-size:12px;border-left:2px solid var(--accent-line);padding-left:12px;display:flex;flex-direction:column;gap:5px}
.trace div span{color:var(--muted)}
.fig{background:#fff;border-radius:8px;border:1px solid var(--line);padding:6px}
.fig img{display:block;width:100%;height:auto;border-radius:4px}
.figcap{font-size:12px;color:var(--muted);padding:8px 4px 0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;flex:none}

/* ---------- comms hub ---------- */
.hubtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mail3{display:grid;grid-template-columns:200px minmax(260px,330px) minmax(0,1fr);height:min(680px,calc(100vh - 210px));min-height:520px}
.mfold{border-right:1px solid var(--line);overflow-y:auto;padding:10px 0;background:var(--surface-2);border-radius:10px 0 0 10px}
.mfold .fh{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 14px 4px}
.fold{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 14px;font-size:13px;cursor:pointer;text-align:left;color:var(--ink)}
.fold:hover{background:var(--line-2)}
.fold.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fold .c{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.fold.on .c,.fold .c.u{color:var(--accent);font-weight:700}
.fold .dotc{width:8px;height:8px;border-radius:2px;flex:none}
.mlist{border-right:1px solid var(--line);overflow-y:auto}
.msrch{padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mrow{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;position:relative}
.mrow:hover{background:var(--surface-2)}
.mrow.on{background:var(--accent-soft)}
.mrow.unread::before{content:"";position:absolute;left:3px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mrow .mb2{flex:1;min-width:0}
.mrow .l1{display:flex;gap:6px;align-items:baseline}
.mrow .l1 b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mrow.unread .l1 b,.mrow.unread .sj{font-weight:700}
.mrow .l1 .tm{margin-left:auto;font-size:11px;color:var(--muted);flex:none}
.mrow .sj{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .sn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .att{font-size:11px;color:var(--muted)}
.mread{overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.mread .rh{padding:16px 20px;border-bottom:1px solid var(--line)}
.mread .rh h2{font-family:var(--f-display);font-size:20px;line-height:1.2}
.mread .rb{padding:16px 20px;white-space:pre-wrap;font-size:13.5px;line-height:1.6;flex:1}
.mread .ra{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.attc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;margin:0 6px 6px 0;background:var(--surface-2)}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:13px;padding:30px;text-align:center}
@media (max-width:1000px){.mail3{grid-template-columns:minmax(0,1fr);height:auto}.mfold{border-right:0;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;display:flex;overflow-x:auto;padding:6px}.mfold .fh{display:none}.fold{width:auto;white-space:nowrap}.mlist{max-height:340px;border-right:0;border-bottom:1px solid var(--line)}}

.cal3{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:0}

const R = n => "R " + (Math.round(n * 100) / 100).toLocaleString("en-ZA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const MON = MONTHS.map(m => m.slice(0, 3));
function nowStamp() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fmtDate(iso) { if (!iso) return "—"; const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return d + " " + MON[m - 1] + " " + y; }
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function daysBetween(a, b) { return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000); }
function initials(n) { return String(n).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase(); }
const AVC = ["#6A4FB3", "#1F7A6D", "#2A6496", "#A8670F", "#8E3B6E", "#3D6B2F", "#B42318", "#4B5BA8"];
function avColor(n) { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVC[h % AVC.length]; }
function avatar(n, size) { const s = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px` : ""; return `<span class="av" style="background:${avColor(n)};${s}">${esc(initials(n))}</span>`; }
function hash(str) { // FNV-1a 64-bit-ish (two 32-bit lanes) — evidence fingerprint for the demo
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 ^= c; h1 = Math.imul(h1, 16777619) >>> 0; h2 ^= c + i; h2 = Math.imul(h2, 2246822519) >>> 0; }
  return (h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0"));
}

const RULEPACK = {
  id: "SA-STAT-2026.10", label: "South Africa statutory pack 2026/27 · v10 (illustrative parameters)",
  brackets: [[0, 237100, 0, .18], [237101, 370500, 42678, .26], [370501, 512800, 77362, .31], [512801, 673000, 121475, .36], [673001, 857900, 179147, .39], [857901, 1817000, 251258, .41], [1817001, 1e12, 644489, .45]],

  medCredit: { main: 364, firstDep: 364, addDep: 246 },

/* ---------------- payroll engine (deterministic, with trace) ---------------- */
function ageOn(dob, iso) { const a = new Date(dob), b = new Date(iso); let y = b.getFullYear() - a.getFullYear(); if (b < new Date(b.getFullYear(), a.getMonth(), a.getDate())) y--; return y; }
function annualTax(taxable, age) {
  const P = S.rules.params; const br = RULEPACK.brackets; let t = 0;
  for (const [lo, hi, base, rate] of br) if (taxable >= lo && taxable <= hi) { t = base + (taxable - (lo === 0 ? 0 : lo - 1)) * rate; break; }
  let reb = RULEPACK.rebates.primary; if (age >= 65) reb += RULEPACK.rebates.secondary; if (age >= 75) reb += RULEPACK.rebates.tertiary;
  return { gross: t, rebate: reb, net: Math.max(0, t - reb) };
}
function calcEmp(e, period, opts) {
  opts = opts || {};
  const P = S.rules.params, tr = [];
  const isHourly = e.pay === "hourly";
  const hours = opts.hours != null ? opts.hours : e.hours;
  const basic = cents(isHourly ? e.rate * hours : e.salary);
  tr.push(["Source facts", isHourly ? `${hours} h × ${R(e.rate)} (rate eff. ${e.rateEff || "2026-03-01"})` : `Monthly salary ${R(e.salary)} (contract ${e.contract || "permanent"})`]);
  const ot = cents((opts.ot != null ? opts.ot : e.ot || 0) * (isHourly ? e.rate : e.salary / 195) * 1.5);
  if (ot) tr.push(["Overtime", `${opts.ot != null ? opts.ot : e.ot} h × 1.5 = ${R(ot)} (BCEA s10)`]);
  const comm = cents(opts.comm != null ? opts.comm : e.comm || 0);
  if (comm) tr.push(["Commission", R(comm)]);
  const allow = cents(e.allow || 0);
  if (allow) tr.push(["Allowance", R(allow) + " (" + (e.allowName || "allowance") + ")"]);
  const gross = cents(basic + ot + comm + allow);
  tr.push(["Gross remuneration", R(gross)]);
  const pension = e.pension ? cents(basic * RULEPACK.pensionRate) : 0;
  if (pension) tr.push(["Pension fund (7.5% of basic)", "− " + R(pension) + " deductible"]);
  const taxableM = cents(gross - pension);
  const annual = cents(taxableM * 12);
  const age = ageOn(e.dob, period + "-28");
  const at = annualTax(annual, age);
  tr.push(["Annualise taxable", `${R(taxableM)} × 12 = ${R(annual)} (age ${age})`]);
  tr.push(["Tax table lookup", `${RULEPACK.id} bracket → ${R(at.gross)} − rebates ${R(at.rebate)} = ${R(at.net)}`]);
  let mtc = 0; if (e.medical) { mtc = RULEPACK.medCredit.main + (e.deps > 0 ? RULEPACK.medCredit.firstDep : 0) + Math.max(0, (e.deps || 0) - 1) * RULEPACK.medCredit.addDep; }
  const paye = Math.max(0, cents(at.net / 12 - mtc));
  if (mtc) tr.push(["Medical tax credit", "− " + R(mtc) + ` (${1 + (e.deps || 0)} member${e.deps ? "s" : ""})`]);
  tr.push(["PAYE (source 4102)", R(paye)]);
  const uifBase = Math.min(gross, P.uifCeiling);
  const uif = e.uifExempt ? 0 : cents(uifBase * RULEPACK.uifRate);
  tr.push(["UIF employee 1%", e.uifExempt ? "Exempt (" + e.uifExempt + ")" : `min(${R(gross)}, ceiling ${R(P.uifCeiling)}) × 1% = ${R(uif)}`]);
  const medical = cents(e.medical || 0);
  let garn = 0;
  if (e.garn) { const cap = cents(basic * RULEPACK.eaoCap); garn = Math.min(e.garn, cap); tr.push(["Emoluments attachment order", `${R(e.garn)} capped at 25% of basic (${R(cap)}) → ${R(garn)}`]); }
  const net = cents(gross - paye - uif - pension - medical - garn);
  tr.push(["Net pay", R(net)]);
  const sdl = cents(gross * RULEPACK.sdlRate), uifEr = uif;
  const eti = e.eti && age >= 18 && age <= 29 && gross <= 7500 ? 750 : 0;
  tr.push(["Employer", `UIF ${R(uifEr)} · SDL ${R(sdl)}${eti ? " · ETI claim " + R(eti) + " (illustrative)" : ""}`]);
  const nmwRate = isHourly ? e.rate : e.salary / 195;
  return { id: e.id, name: e.name, basic, ot, comm, allow, gross, pension, paye, uif, medical, garn, net, sdl, uifEr, eti, trace: tr, nmwRate };
}

const MIME = { xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", csv: "text/csv", txt: "text/plain", json: "application/json", pdf: "application/pdf" };
async function saveFile(filename, bytes) {
  const ext = filename.split(".").pop().toLowerCase();
  const blob = bytes instanceof Blob ? bytes : new Blob([bytes], { type: MIME[ext] || "application/octet-stream" });
  if (dlCap) {
    const dl = await Promise.race([dlCap, new Promise(r => setTimeout(() => r(null), 1500))]);
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast("Saved " + filename, "ok"); return; }
      catch (e) { const c = e && e.code; if (c === "declined") { toast("Download cancelled."); return; } if (c === "rejected_extension" || c === "extension_not_enabled") { toast("This viewer doesn't allow ." + ext + " files. Download the HTML and open it locally to export.", "bad"); return; } }
    }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  toast("Downloading " + filename, "ok");
}

/* ------------------------------------------------ 04 PAYROLL RUN */
function nextAction() {
  const r = S.run; const open = r.exceptions.filter(x => !x.resolved);
  switch (r.state) {
    case "Draft": return { label: "Freeze inputs & population", perm: "run.freeze", act: "run.freeze" };
    case "Input Frozen": return { label: "Run validations", perm: "run.validate", act: "run.validate" };
    case "Validated": return { label: "Calculate gross-to-net", perm: "run.calc", act: "run.calc", block: open.some(x => x.sev === "Critical") ? "Resolve every critical exception before calculating." : "" };
    case "Calculated": return { label: "Complete variance review", perm: "run.review", act: "run.review", block: open.length ? "Disposition every warning (accept with reason) first." : "" };
    case "Reviewed": return { label: "Generate evidence pack & submit for approval", perm: "run.submit", act: "run.submit" };
    case "Awaiting Approval": return { label: "Approve payroll (step-up)", perm: "run.approve", act: "run.approve" };
    case "Approved": return { label: "Finalise — commit immutable ledger", perm: "run.finalise", act: "run.finalise" };
    case "Finalised": return { label: "Create payment batches", perm: "run.batch", act: "run.batch" };
    case "Payment Pending": return { label: "Authorise & release in Payments", perm: "pay.authorise", act: "go.payments" };
    case "Paid": return { label: "Prepare EMP201 & UIF declaration", perm: "run.statutory", act: "run.statutory" };
    case "Compliance Pending": return { label: "Validate, approve and submit in Compliance", perm: "file.validate", act: "go.compliance" };
    case "Filed": return { label: "Close period", perm: "run.close", act: "run.close" };
    default: return null;
  }
}

function moveRun(to) { const r = S.run; r.state = to; r.stateIdx = STATES.indexOf(to); r.history.push({ state: to, ts: nowStamp(), by: me().name + " (" + me().title + ")" }); audit("Run → " + to, r.id); }
function buildExceptions() {
  const P = S.rules.params, ex = [];
  S.run.population.forEach(id => {
    const e = emp(id);
    if (e.pay === "hourly" && e.rate < P.nmw) ex.push({ id: uid("EX"), emp: id, sev: "Critical", code: "NMW", title: `Below national minimum wage — ${e.name}`, detail: `${R(e.rate)}/h vs R${P.nmw.toFixed(2)}/h effective 1 March 2026 (rate set ${e.rateEff}).`, opts: ["Uplift to R" + P.nmw.toFixed(2) + " + raise arrears correction", "Record exemption evidence"] });
    if (!e.acct) ex.push({ id: uid("EX"), emp: id, sev: "Critical", code: "BANK", title: `No bank account — ${e.name}`, detail: "Net pay cannot be paid by EFT.", opts: ["Exclude from batch (pay manually)"] });
    if (!taxOk(e.tax)) ex.push({ id: uid("EX"), emp: id, sev: "Warning", code: "TAX", title: `Tax reference ${e.tax ? "invalid" : "missing"} — ${e.name}`, detail: "Payroll can proceed; EMP501/IRP5 will be rejected by SARS until fixed.", opts: ["Accept for this run & open case", "Capture tax number now"] });
    const p = S.prior[id]; if (p) { const c = calcEmp(e, "2026-10"); const d = (c.net - p.net) / p.net * 100; if (Math.abs(d) > 15) ex.push({ id: uid("EX"), emp: id, sev: "Warning", code: "VAR", title: `Net pay variance ${d.toFixed(0)}% — ${e.name}`, detail: `October net ${R(c.net)} vs September ${R(p.net)}.`, opts: ["Accept — commission per approved schedule", "Hold employee for review"] }); }
  });
  const accts = {}; S.run.population.forEach(id => { const a = emp(id).acct; if (a) (accts[a] = accts[a] || []).push(id); });
  Object.values(accts).filter(v => v.length > 1).forEach(v => ex.push({ id: uid("EX"), emp: v[1], sev: "Critical", code: "DUPBANK", title: `Duplicate bank account — ${v.map(x => emp(x).name).join(" & ")}`, detail: "Same account number on two employees; bank pre-note reports a name mismatch for " + emp(v[1]).name + ".", opts: ["Hold " + emp(v[1]).name + " payment pending verification", "Confirm verified (evidence on file)"] }));
  return ex;
}
function calcRun() {
  S.run.results = S.run.population.map(id => { const r = calcEmp(emp(id), "2026-10"); r.held = !!(S.run.held || []).includes(id); return r; });
}

function explainPay(id) {
  const fin = S.ledger.find(l => l.period === "2026-10");
  const now = fin ? S.run.results.find(r => r.id === id) : calcEmp(emp(id), "2026-10"); const p = S.prior[id];
  if (!now || !p) return [];
  const out = []; const d = (a, b) => cents(a - b);
  if (d(now.comm, p.comm)) out.push([d(now.comm, p.comm) > 0 ? "up" : "down", `Commission ${d(now.comm, p.comm) > 0 ? "increased" : "decreased"} by ${R(Math.abs(d(now.comm, p.comm)))}`]);
  if (d(now.ot, p.ot)) out.push([d(now.ot, p.ot) > 0 ? "up" : "down", `Overtime ${d(now.ot, p.ot) > 0 ? "up" : "down"} ${R(Math.abs(d(now.ot, p.ot)))}`]);
  if (d(now.basic, p.basic)) out.push([d(now.basic, p.basic) > 0 ? "up" : "down", `Basic pay changed by ${R(d(now.basic, p.basic))} (rate or hours)`]);
  if (d(now.paye, p.paye)) out.push([d(now.paye, p.paye) > 0 ? "down" : "up", `PAYE ${d(now.paye, p.paye) > 0 ? "rose" : "fell"} ${R(Math.abs(d(now.paye, p.paye)))} because taxable pay changed`]);
  if (d(now.uif, p.uif)) out.push(["down", `UIF changed by ${R(d(now.uif, p.uif))}`]);
  if (!out.length) out.push(["", "No change from last month: same earnings, deductions and tax."]);
  return out.concat([["", `Net pay: ${R(p.net)} → ${R(now.net)}`]]);
}

function projHealth(id) {
  const ts = S.tasks.filter(t => t.proj === id); const tdy = todayISO();
  const overdue = ts.filter(t => t.status !== "done" && t.due < tdy).length, blocked = ts.filter(t => t.status === "blocked").length, red = S.raid.filter(r => r.proj === id && r.rating === "Red" && r.status === "Open").length;
  const score = overdue + blocked * 2 + red * 2;
  const cls = score >= 4 ? "bad" : score >= 1 ? "warn" : "ok";
  return { total: ts.length, done: ts.filter(t => t.status === "done").length, overdue, blocked, red, cls, label: cls === "bad" ? "Red" : cls === "warn" ? "Amber" : "Green" };
}

  "cal.conn": d => { if (!need("ad.admin", "Connecting a calendar needs admin consent")) return; S.calendars[d.k] = !S.calendars[d.k]; audit((S.calendars[d.k] ? "Calendar connected: " : "Calendar disconnected: ") + d.k, "Calendar"); done(S.calendars[d.k] ? `${d.k === "google" ? "Google" : "Outlook"} calendar connected (OAuth consent simulated).${d.k === "google" ? " 2 partner events now visible." : ""}` : `${d.k === "google" ? "Google" : "Outlook"} calendar disconnected.`); },
  "cal.add": () => { if (!need("comms.send")) return; const t = val("ev-title"); if (!t) return toast("Give the event a title.", "bad"); const sel = UI.calSel || todayISO(); S.cal.push({ id: uid("EV"), date: sel, title: t, type: val("ev-type"), time: val("ev-time") || "09:00", ctx: val("ev-ctx") || null, room: (S.rooms.find(r => r.ctx === val("ev-ctx")) || {}).id || null, src: "internal" }); audit("Event added", t, sel); done(`Added to ${fmtDate(sel)}${S.calendars.outlook ? " and synced to Outlook" : ""}.`); },
  "cal.del": d => { if (!need("comms.send")) return; const e = S.cal.find(x => x.id === d.id); S.cal = S.cal.filter(x => x.id !== d.id); audit("Event removed", e.title); done("Event removed."); },

  /* ---------- comms: chat ---------- */
  "chat.open": d => { UI.roomSel = d.id; UI.replyTo = null; UI.hubTab = "chat"; if (UI.view !== "comms") go("comms"); else render(); focusChat(); },
  "chat.dec": d => { if (!need("comms.send")) return; const rm = S.rooms.find(r => r.msgs.some(x => x.id === d.id)); const m = rm.msgs.find(x => x.id === d.id); m.decision = !m.decision; if (m.decision) audit("Decision recorded", rm.name, m.text); done(m.decision ? "Pinned as a decision in the room info." : "Decision unpinned."); },
  "chat.reply": d => { UI.replyTo = d.id; render(); focusChat(); },
  "chat.noreply": () => { UI.replyTo = null; render(); focusChat(); },
  "chat.mention": d => { UI.chatDraft = (UI.chatDraft || "").replace(/@[^@\s]*$/, "@" + d.n + " "); UI.mention = null; render(); focusChat(); },
  "chat.send": () => sendChat(),
  "chat.newroom": () => { if (!need("comms.send")) return; modal("New room", `<div class="f"><label for="rm-n">Room name</label><input id="rm-n" placeholder="e.g. November payroll"></div><div class="f"><label for="rm-c">Context</label><select id="rm-c"><option value="">None</option>${opt(S.contexts.map(c => [c.id, c.name]))}</select></div><div class="f"><label>Members</label><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px">${Object.values(ROLES).filter(r => !r.title.includes("read-only")).map((r, i) => `<label style="display:flex;gap:6px;align-items:center;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)"><input type="checkbox" class="rm-m" value="${esc(r.name)}" ${r.name === me().name ? "checked" : ""}> ${esc(r.name)}</label>`).join("")}</div></div>`, `<button class="btn" data-a="modal.close">Cancel</button><button class="btn pri" data-a="room.save">Create room</button>`); },
  "room.save": () => { const n = val("rm-n"); if (!n) return toast("Name the room.", "bad"); const mem = [...document.querySelectorAll(".rm-m:checked")].map(x => x.value); if (!mem.includes(me().name)) mem.push(me().name); const id = uid("RM"); S.rooms.splice(S.rooms.filter(r => r.kind === "room").length, 0, { id, name: n, kind: "room", ctx: val("rm-c") || null, members: mem, files: [], msgs: [{ id: uid("CM"), by: me().name, text: `Created ${n}.`, ts: nowStamp(), decision: false, replyTo: null }] }); audit("Chat room created", n, mem.length + " members"); UI.roomSel = id; closeModal(); done(`${n} created.`); },

  /* ---------- connections ---------- */
  "ad.toggle": d => { if (!need("ad.admin", "Connecting a mail tenant needs admin consent")) return; const a = S.adapters[d.k]; if (a.on) { a.on = false; audit("Mail adapter disconnected", a.label); return done(a.label + " disconnected. Mail continues through SMTP/IMAP."); }
    modal(`Connect ${a.label}`, `<div class="callout"><b>${d.k === "graph" ? "Microsoft 365 admin consent" : "Google Workspace domain-wide consent"}</b> (simulated). The hub requests: <span class="mono">${d.k === "graph" ? "Mail.ReadWrite · Mail.Send · Calendars.ReadWrite · offline_access" : "gmail.modify · gmail.send · calendar.events"}</span></div><div class="muted" style="font-size:12.5px">Tokens are stored in the tenant credential vault, rotated automatically, and never shown to users. Change notifications replace polling.</div>`, `<button class="btn" data-a="modal.close">Cancel</button><button class="btn pri" data-a="ad.ok" data-k="${d.k}">Grant consent</button>`); },
  "ad.ok": d => { const a = S.adapters[d.k]; a.on = true; if (d.k === "graph") S.calendars.outlook = true; if (d.k === "gmail") S.calendars.google = true; audit("Mail adapter connected", a.label, "OAuth consent granted"); closeModal(); done(`${a.label} connected. New messages can now be sent via ${a.label}.`); },
  "ad.test": () => { if (!need("comms.send")) return; audit("SMTP test message", "mail.kgotso.example:587", "250 2.0.0 OK queued"); done("Test message accepted: 250 2.0.0 OK (STARTTLS, DKIM signed)."); },
  "rule.file": d => { if (!need("comms.send")) return; const r = S.fileRules[+d.i]; r.on = !r.on; audit("Auto-filing rule " + (r.on ? "enabled" : "disabled"), r.m); done(); },

  /* ---------- projects ---------- */
  "proj.tab": d => { UI.projTab = d.t; render(); },
  "proj.pick": d => { UI.projFilter = d.id; render(); },
  "task.mv": d => { if (!need("proj.edit")) return; const t = S.tasks.find(x => x.id === d.id); const i = COLS.findIndex(c => c[0] === t.status) + (+d.d); t.status = COLS[Math.max(0, Math.min(3, i))][0]; audit("Task moved", t.title, t.status); done(); },
  "task.new": () => { if (!need("proj.edit")) return; modal("New task", `<div class="f"><label for="tk-t">Task</label><input id="tk-t"></div><div class="frow"><div class="f"><label for="tk-p">Project</label><select id="tk-p">${opt(S.projects.map(p => [p.id, p.name]), UI.projFilter !== "all" ? UI.projFilter : "")}</select></div><div class="f"><label for="tk-o">Owner</label><select id="tk-o">${opt(PEOPLE_NAMES(), me().name)}</select></div></div><div class="frow"><div class="f"><label for="tk-d">Due</label><input id="tk-d" type="date" value="${addDays(todayISO(), 7)}"></div><div class="f"><label for="tk-pr">Priority</label><select id="tk-pr">${opt(["High", "Medium", "Low"], "Medium")}</select></div></div>`, `<button class="btn" data-a="modal.close">Cancel</button><button class="btn pri" data-a="task.save">Add task</button>`); },
  "task.save": () => { const t = val("tk-t"); if (!t) return toast("Name the task.", "bad"); S.tasks.unshift({ id: uid("TSK"), proj: val("tk-p"), title: t, owner: val("tk-o"), status: "todo", due: val("tk-d"), pri: val("tk-pr"), src: null }); audit("Task created", t, ctxName(val("tk-p"))); closeModal(); done("Task added."); },
  "raid.add": () => { if (!need("proj.edit")) return; const t = val("rd-text"); if (!t) return toast("Describe the item.", "bad"); S.raid.unshift({ id: uid("RAID"), proj: val("rd-proj"), type: val("rd-type"), text: t, owner: me().name, rating: val("rd-rating"), status: "Open" }); audit("RAID item added", val("rd-type"), t); done("Added to the RAID log."); },
  "raid.close": d => { if (!need("proj.edit")) return; const r = S.raid.find(x => x.id === d.id); r.status = "Closed"; audit("RAID item closed", r.text); done("Closed."); },
  "doc.get": d => { const x = S.docs.find(y => y.id === d.id); if (!x.data) return toast("This is a placeholder in the example data. Upload a real file and it downloads back exactly.", "bad"); const [h, b64] = x.data.split(","); const bin = atob(b64); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); saveFile(x.name, new Blob([u8], { type: (h.match(/data:([^;]+)/) || [])[1] || "application/octet-stream" })); },
  "doc.del": d => { if (!need("proj.edit")) return; const x = S.docs.find(y => y.id === d.id); S.docs = S.docs.filter(y => y.id !== d.id); audit("Document removed", x.name, "v" + x.ver); done(`${x.name} removed (audit kept).`); },
  "exp.proj": () => { const pf = UI.projFilter; const inP = x => pf === "all" || x.proj === pf; exportXlsx(`Projects_${pf === "all" ? "All" : pf}_${todayISO()}.xlsx`, [
    { name: "Projects", rows: [["ID", "Project", "Owner", "Phase", "Start", "End", "Budget (R)", "Spent (R)", "Health", "Tasks done", "Tasks total", "Overdue", "Blocked"]].concat(S.projects.filter(p => pf === "all" || p.id === pf).map(p => { const h = projHealth(p.id); return [p.id, p.name, p.owner, p.phase, p.start, p.end, p.budget, p.spent, h.label, h.done, h.total, h.overdue, h.blocked]; })) },
    { name: "Tasks", rows: [["Task", "Project", "Owner", "Status", "Due", "Priority", "Source"]].concat(S.tasks.filter(inP).map(t => [t.title, ctxName(t.proj), t.owner, COLS.find(c => c[0] === t.status)[1], t.due, t.pri, t.src ? t.src.label : ""])) },
    { name: "RAID", rows: [["Type", "Description", "Project", "Owner", "Rating", "Status"]].concat(S.raid.filter(inP).map(r => [r.type, r.text, ctxName(r.proj), r.owner, r.rating, r.status])) },
    { name: "Documents", rows: [["Document", "Project", "Version", "Size (KB)", "Uploaded by", "When"]].concat(S.docs.filter(inP).map(x => [x.name, ctxName(x.proj), x.ver, Math.round(x.size / 1024), x.by, x.ts])) }]); },
  "exp.status": () => { const pf = UI.projFilter; const ps = S.projects.filter(p => pf === "all" || p.id === pf); const blocks = [{ meta: `${S.company.name} · EMINOVA HR & Payroll Workbench · SBI programme office · ${fmtDate(todayISO())} · prepared by ${me().name}` }, { h1: "Summary" }, { table: [["Project", "Owner", "Health", "Progress", "Overdue", "Blocked", "Ends"]].concat(ps.map(p => { const h = projHealth(p.id); return [p.name, p.owner, h.label, `${h.done}/${h.total}`, String(h.overdue), String(h.blocked), fmtDate(p.end)]; })) }];
    ps.forEach(p => { const h = projHealth(p.id); const open = S.tasks.filter(t => t.proj === p.id && t.status !== "done").sort((a, b) => a.due.localeCompare(b.due)); blocks.push({ h1: p.name }, { meta: `Owner ${p.owner} · ${p.phase} · ${fmtDate(p.start)} – ${fmtDate(p.end)} · RAG ${h.label} · budget ${R0(p.spent)} of ${R0(p.budget)}` });
      const done2 = S.tasks.filter(t => t.proj === p.id && t.status === "done"); if (done2.length) blocks.push({ h2: "Completed" }, { bullets: done2.map(t => t.title) });
      if (open.length) blocks.push({ h2: "Open actions" }, { table: [["Action", "Owner", "Due", "Status", "Priority"]].concat(open.map(t => [t.title, t.owner, fmtDate(t.due), COLS.find(c => c[0] === t.status)[1], t.pri])) });
      const rd = S.raid.filter(r => r.proj === p.id && r.status === "Open"); if (rd.length) blocks.push({ h2: "Risks, issues and dependencies" }, { table: [["Type", "Description", "Owner", "Rating"]].concat(rd.map(r => [r.type, r.text, r.owner, r.rating])) }); });
    exportDocx(`Project_Status_Report_${todayISO()}.docx`, "Project status report", blocks); }
};

function readCompose() { const c = UI.compose; if (!c) return; ["to", "cc", "subj", "body", "ctx", "via"].forEach(k => { const el = document.getElementById("c-" + k); if (el) c[k] = el.value; }); }
function focusChat() { setTimeout(() => { const i = $("#chat-in"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 20); }
function sendChat() {
  if (!need("comms.send")) return; const rm = S.rooms.find(r => r.id === UI.roomSel) || S.rooms[0]; let t = (UI.chatDraft || "").trim();
  if (!t && !UI.attach.length) return; if (UI.attach.length) { rm.files.push(...UI.attach); t = (t ? t + " " : "") + "[attached: " + UI.attach.join(", ") + "]"; }
  if (!rm.members.includes(me().name)) rm.members.push(me().name);
  rm.msgs.push({ id: uid("CM"), by: me().name, text: t, ts: nowStamp(), decision: false, replyTo: UI.replyTo });
  const men = mentionPool(rm).find(n => t.includes("@" + n)); if (men && !rm.members.includes(men)) rm.members.push(men);
  UI.chatDraft = ""; UI.replyTo = null; UI.attach = []; UI.mention = null; save(); render(); focusChat();
  if (men) setTimeout(() => { rm.msgs.push({ id: uid("CM"), by: men, text: `Noted, ${me().name.split(" ")[0]} — I'll pick this up today.`, ts: nowStamp(), decision: false, replyTo: null }); save(); if (UI.view === "comms" && UI.hubTab === "chat" && UI.roomSel === rm.id) { render(); focusChat(); } }, 1400);
}
function uploadDocs(files) {
  if (!need("proj.edit")) return; const proj = val("doc-proj") || (UI.projFilter !== "all" ? UI.projFilter : S.projects[0].id);
  [...files].forEach(f => { const big = f.size > 3 * 1024 * 1024; const finish = data => { const ex = S.docs.find(x => x.name === f.name && x.proj === proj); if (ex) { ex.ver++; ex.size = f.size; ex.ts = nowStamp(); ex.by = me().name; ex.data = data; } else S.docs.unshift({ id: uid("DOC"), proj, name: f.name, size: f.size, type: f.name.split(".").pop(), by: me().name, ts: nowStamp(), ver: 1, data }); audit("Document uploaded", f.name, ctxName(proj) + (ex ? " · v" + ex.ver : " · v1")); save(); render(); toast(ex ? `${f.name} → v${ex.ver}` : `${f.name} uploaded to ${ctxName(proj)}${big ? " (metadata only — over 3 MB)" : ""}.`, "ok"); };
    if (big) return finish(null); const rd = new FileReader(); rd.onload = () => finish(rd.result); rd.onerror = () => toast("Couldn't read " + f.name, "bad"); rd.readAsDataURL(f); });
}

/* ---------------- event wiring ---------------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el) { if (UI.mention && !ev.target.closest(".composer")) { UI.mention = null; render(); } return; }
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a !== "modal.veil") ev.preventDefault();
  try { fn(el.dataset, el, ev); } catch (e) { console.error(e); toast("Something went wrong: " + e.message, "bad"); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "pq") { UI.pq = t.value; const p = t.selectionStart; render(); const n = $("#pq"); n.focus(); n.setSelectionRange(p, p); }
  if (t.id === "mq") { UI.mq = t.value; const p = t.selectionStart; render(); const n = $("#mq"); n.focus(); n.setSelectionRange(p, p); }
  if (t.id && t.id.startsWith("c-") && UI.compose && t.id !== "c-tpl") readCompose();
  if (t.id === "chat-in") { UI.chatDraft = t.value; const m = t.value.match(/@([^@\s]*)$/); const had = UI.mention != null; UI.mention = m ? m[1] || " " : null; if (UI.mention === " ") UI.mention = ""; if (m || had) { render(); focusChat(); } }
  if (["wf-pct", "wf-h", "wf-s"].includes(t.id)) { UI.whatif[{ "wf-pct": "pct", "wf-h": "hires", "wf-s": "salary" }[t.id]] = +t.value; render(); const n = document.getElementById(t.id); if (n) n.focus(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "role") { S.role = t.value; UI.compose = null; save(); render(); toast(`Now acting as ${me().name} — ${me().title}.`); }
  if (t.id === "essEmp") { UI.essEmp = t.value; render(); }
  if (t.id === "projf") { UI.projFilter = t.value; render(); }
  if (t.id === "ps-e") A["run.payslips"]({ id: t.value });
  if (t.classList.contains("tstat")) { if (!need("proj.edit")) return render(); const k = S.tasks.find(x => x.id === t.dataset.id); k.status = t.value; audit("Task status changed", k.title, t.value); done(); }
  if (t.id === "fileto" && t.value) { if (!need("comms.send")) return; const m = S.mail.find(x => x.id === t.dataset.id); m.ctx = t.value; audit("Mail filed to context", m.subj, ctxName(t.value)); done(`Filed to ${ctxName(t.value)}.`); }
  if (t.id === "c-tpl" && t.value && UI.compose) { readCompose(); const tp = TEMPLATES[t.value]; const cn = ctxName(UI.compose.ctx) || ""; UI.compose.subj = tp.subj(cn); UI.compose.body = tp.body(cn); render(); }
  if (t.id === "c-ctx" && UI.compose) readCompose();
  if (t.id === "chat-file") { UI.attach = [...t.files].map(f => f.name); render(); focusChat(); }
  if (t.id === "doc-file") uploadDocs(t.files);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("#modal").innerHTML) closeModal();
  if (ev.target.id === "chat-in" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); if (UI.mention != null) { const rm = S.rooms.find(r => r.id === UI.roomSel); const hit = mentionPool(rm).find(n => n.toLowerCase().includes(UI.mention.toLowerCase())); if (hit) return A["chat.mention"]({ n: hit }); } sendChat(); }
  if (ev.target.id === "otp" && ev.key === "Enter") A["stepup.ok"]();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-a]:not(button):not(input):not(select)")) { ev.preventDefault(); ev.target.click(); }
});
/* drag & drop: kanban + document upload */
document.addEventListener("dragstart", ev => { const c = ev.target.closest && ev.target.closest(".tc"); if (c) { ev.dataTransfer.setData("text/plain", c.dataset.task); ev.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", ev => { const col = ev.target.closest && ev.target.closest(".col"); const dz = ev.target.closest && ev.target.closest("#drop"); if (col || dz) { ev.preventDefault(); (col || dz).classList.add(col ? "drag" : "over"); } });
document.addEventListener("dragleave", ev => { const col = ev.target.closest && ev.target.closest(".col, #drop"); if (col) col.classList.remove("drag", "over"); });
document.addEventListener("drop", ev => {
  const col = ev.target.closest && ev.target.closest(".col"); const dz = ev.target.closest && ev.target.closest("#drop");
  if (dz) { ev.preventDefault(); dz.classList.remove("over"); if (ev.dataTransfer.files.length) uploadDocs(ev.dataTransfer.files); return; }
  if (col) { ev.preventDefault(); col.classList.remove("drag"); const id = ev.dataTransfer.getData("text/plain"); const t = S.tasks.find(x => x.id === id); if (!t || !need("proj.edit")) return render(); t.status = col.dataset.col; audit("Task moved", t.title, t.status); done(); }
});

/* ---------------- boot ---------------- */
(function boot() {
  S = load();
  if (!S) { S = seed(); initPrior(); audit("Demo initialised", "Example data loaded", S.company.name); save(); }
  $("#role").innerHTML = Object.entries(ROLES).map(([k, r]) => `<option value="${k}">${esc(r.name)} — ${esc(r.title)}</option>`).join("");
  if (location.hash && NAV.some(n => n.id === location.hash.slice(1))) UI.view = location.hash.slice(1);
  render();
})();

</script>
